  const count = x => typeof x === 'number' ? x : null;
  const vals = {                                           // hodnoty a klíče, žádný text v jazyce stránky: buňky z nich skládá cellsOf
    driver, model: driver === 'model' ? $('model').value : null, extra: driver === 'model' && $('extra').checked, mirror: driver === 'model' && mirrorOn,
    scenario: SC.id, set: SC.id === 'emails' || SC.id === 'public' ? SC.label : null, lanes: SC.choices ? SC.choices() : LANES,
    mode: how.mode, aborted: !!how.aborted, speed: how.speed ?? null, best: how.best ?? null, n: s.n,
    avg: NUM(s.avg), p50: NUM(s.p50), p95: NUM(s.p95), min: NUM(s.min), max: NUM(s.max), rate: NUM(s.rate),
    acc: NUM(s.acc), ece: NUM(s.ece), stab: NUM(s.stab), errors: count(r.errors), late: count(r.late), dist: inGame ? NUM(G.dist) : null,
    joule: NUM(e.perDecision), temp: NUM(e.maxTemp), fooled: injectOn ? NUM(s.fooled) : null,
    runlen: inGame && runLimit ? runLimit : null, seed: $('seed').value.trim(),
    f1: SC.labelsOf ? NUM(s.f1) : null, goodput: NUM(runGoodput(inGame)), usd: NUM(s.usd1000), net: NUM(runNet),
    note: [...(runTag ? runTag.note : []), inGame && runLimit && runWhy === 'stop' && ['stopped'], runWhy === 'error' && ['error'],
           runHosted && S.n > S.usd.length && ['unpriced', { missing: S.n - S.usd.length, n: S.n }],     // započtené odpovědi (S.n) bez ceny; zrcadla, zahřívací a neúspěšné dotazy v S nejsou
           runHosted && ['network'], S.retries > 0 && ['retries', { n: S.retries }]].filter(Boolean) };
  const rec = { id: null, ts: localIso(), data: { vals, settings: runSettings, kind: runKind, why: runWhy,
                                                   batch: runTag ? runTag.batch : null, step: runTag ? runTag.step : null } };
  lastRec = rec;
  RESULTS.unshift(rec); renderResults();
  api('POST', '/results', rec.data).then(saved => { rec.id = saved.id; rec.ts = saved.ts; dbOk(); },
    e => { rec.unsaved = true; dbFail(e); });              // neuložený výsledek si to pamatuje (viz renderDbNote); znovu se sám neposílá — server ho mohl zapsat i po vypršení limitu
  return rec;
}

const resultsLocked = () => planRunning;                   // jedna podmínka pro Smazat výsledky i tlačítka v řádcích: fronta zapisuje výsledky, smazání uprostřed by rozbilo dávku
let clearTimer = null, clearArmed = 0;                     // clearTimer běží = tlačítko je odjištěné; clearArmed = čas prvního kliku (performance.now)
const clearLook = () => { $('clear').textContent = t(clearTimer ? 'results.clearArmed' : 'ui.clear'); };      // text tlačítka podle stavu; volá ho i renderLang, aby odjištěné tlačítko přepnutí jazyka přežilo
function clearResults() {                                  // smazání s potvrzením druhým klikem do 4 s; druhý klik platí až po půl sekundě, aby nic nesmazal dvojklik
  const disarm = () => { clearTimeout(clearTimer); clearTimer = null; clearLook(); };
  if (resultsLocked()) return;                             // za běhu fronty se nemaže (tlačítko je vypnuté, viz renderPlan)
  if (!clearTimer) { clearArmed = performance.now(); clearTimer = setTimeout(disarm, 4000); clearLook(); return; }
  if (performance.now() - clearArmed < 500) return;
  disarm();
  RESULTS = []; renderResults(); renderDbNote();
  api('DELETE', '/results').then(dbOk, e => dbFail(() => t('results.onlyOnPage', { error: say(e.say || e.message) })));
}

// Smazání jednoho výsledku: tlačítko v posledním sloupci řádku, potvrzení druhým klikem jako u Smazat výsledky.
let rowArm = null;                                         // odjištěné tlačítko řádku { btn, at, timer }; nejvýš jedno
function rowDelLook(btn, armed) {                          // text, popisek a vzhled tlačítka v řádku
  btn.textContent = armed ? t('results.rowArmed') : '×'; btn.classList.toggle('armed', armed);
  btn.setAttribute('aria-label', t(armed ? 'results.rowArmedLabel' : 'results.rowLabel'));
  setTip(btn, t(armed ? 'results.rowArmedTip' : 'results.rowTip'));
  if (tipFor === btn) showTip(btn);                        // bublina otevřená nad tlačítkem ukáže nový text
}
function disarmRow() {
  if (!rowArm) return;
  clearTimeout(rowArm.timer); rowDelLook(rowArm.btn, false); rowArm = null;
}
function deleteRow(rec, btn) {                             // první klik odjistí právě toto tlačítko (jiné odjištěné se vrátí), druhý po 0,5 s a do 4 s smaže
  if (resultsLocked()) return;
  if (!rowArm || rowArm.btn !== btn) { disarmRow(); rowArm = { btn, at: performance.now(), timer: setTimeout(disarmRow, 4000) }; rowDelLook(btn, true); return; }
  if (performance.now() - rowArm.at < 500) return;
  disarmRow();
  RESULTS = RESULTS.filter(r => r !== rec); renderResults(); renderDbNote();
  if (!Number.isInteger(rec.id)) return;                   // neuložený, nebo se ještě ukládá: není co mazat v databázi
  api('DELETE', '/results/' + rec.id).then(dbOk,
    e => e.status === 404 ? dbOk() : dbFail(() => t('results.rowOnlyOnPage', { error: say(e.say || e.message) })));      // 404: řádek už v databázi není
}

// ---------- úložiště: dotazy na server, poslední nastavení ----------
// Chyba dotazu: věta ze serveru a hláška prohlížeče jsou text a zůstávají, jak přišly. Větu, kterou skládá stránka sama (own), nese chyba
// i jako funkci say: hláška pod tabulkou výsledků ji po přepnutí jazyka složí znovu. Všude jinde se čte jen message.
const apiError = (text, status, own) => Object.assign(new Error(own ? own() : text), { status, say: own });
async function api(method, path, body, ms = 5000) {        // JSON tam i zpět s časovým limitem; chyba = výjimka s větou pro uživatele
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await req(path, { method, body: body === undefined ? undefined : JSON.stringify(body), signal: ctl.signal });
    const j = await r.json();
    if (!r.ok) throw apiError(j.error, r.status, j.error ? null : () => t('db.status', { status: r.status }));
    return j;
  } catch (e) {
    throw apiError(e.message, e.status, e.name === 'AbortError' ? () => t('db.timeout', { s: ms / 1000, path }) : e.say);      // status = kód odpovědi serveru; při výpadku spojení chybí
  } finally { clearTimeout(timer); }
}
// Hláška pod tabulkou výsledků se skládá ze stavu. Větu o poslední chybě smaže další úspěšný dotaz; zbylé věty úspěch nesmaže:
// výsledky, které jsou jen na stránce, a nastavení nebo fronta, které se nepodařilo načíst — ty se pak neukládají, aby stránka nepřepsala, co nenačetla.
let dbError = '';                                          // poslední chyba úložiště: věta, nebo funkce, která ji složí v jazyce stránky (viz say); '' = poslední dotaz prošel
let settingsRead = false, planRead = false;                // nastavení / fronta se ze serveru opravdu přečetly (i prázdné) a stránka je ukazuje
let storedModel = '';                                      // model z nastavení přečteného ze serveru
let initDone = false;                                      // init doběhl; do té doby jsou tlačítka běhu a fronty zamčená
function renderDbNote() {
  const unsaved = RESULTS.filter(r => r.unsaved).length, error = say(dbError);
  const parts = [error && t('db.broken', { error }), unsaved && t('db.unsaved', { n: unsaved }),
    initDone && !settingsRead && t('db.noSettings'), initDone && !planRead && t('db.noPlan')].filter(Boolean);
  $('dbNote').textContent = parts.map((p, i) => i < parts.length - 1 && !/[.!?]$/.test(p) ? p + '.' : p).join(' ');     // samotná věta o chybě zůstává doslova
}
const dbFail = e => { dbError = typeof e === 'function' ? e : e.say || e.message; renderDbNote(); };      // e = chyba (viz apiError), nebo funkce, která větu složí v jazyce stránky
const dbOk = () => { dbError = ''; renderDbNote(); };

// Výchozí nastavení; klíče = id ovládacích prvků. Stejný tvar má nastavení v databázi, v záznamu výsledku i v kroku fronty.
const DEFAULTS = { scenario: 'obstacles', lanes: 3, driver: 'model', model: '', mode: 'realtime', speed: 2,
                   extra: false, mirror: false, inject: false, benchn: 30, runlen: 0, seed: '', deadline: '' };

// Limit na rozhodnutí v ms: jedno pravidlo pro čtení pole, uložení, souhrn kroku i běh. Číslo > 0 se omezí na 1…600000 a zaokrouhlí
// (jako počet úloh); prázdné, nečíselné a ≤ 0 znamená bez limitu ('').
const deadlineOf = v => {
  const n = typeof v === 'number' || (typeof v === 'string' && v.trim() !== '') ? +v : NaN;
  return Number.isFinite(n) && n > 0 ? Math.round(Math.min(600000, Math.max(1, n))) : '';
};

function readSettings() {                                  // úplné nastavení běhu z ovládacích prvků
  return { scenario: $('scenario').value, lanes: +$('lanes').value, driver: $('driver').value, model: $('model').value,
           mode: $('mode').value, speed: +$('speed').value, extra: $('extra').checked, mirror: $('mirror').checked,
           inject: $('inject').checked, benchn: +$('benchn').value, runlen: +$('runlen').value, seed: $('seed').value.trim(),
           deadline: deadlineOf($('deadline').value) };
}

const hasOption = (select, value) => [...select.options].some(o => o.value === value && !o.disabled);

// Nastaví ovládací prvky podle uloženého nastavení (z databáze po načtení stránky, z kroku fronty).
// Snese cokoli: chybějící nebo nesmyslná hodnota = výchozí. Vrací seznam toho, co obnovit nešlo: { key, text }; text se skládá
// až při čtení, v jazyce, který stránka zrovna má.
async function applySettings(saved) {
  const s = { ...DEFAULTS, ...(saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {}) }, notes = [];
  const num = (v, min, max, dflt) => (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && Number.isFinite(+v) ? Math.min(max, Math.max(min, +v)) : dflt;
  const pick = (id, v) => { $(id).value = hasOption($(id), v) ? v : DEFAULTS[id]; };
  if (hasOption($('scenario'), s.scenario)) $('scenario').value = s.scenario;
  else { $('scenario').value = DEFAULTS.scenario; notes.push({ key: 'scenario', get text() { return t('settings.noScenario', { name: s.scenario }); } }); }
  await selectScenario();
  if (!notes.length && $('scenario').value !== s.scenario) notes.push({ key: 'scenario', get text() { return t('settings.noDataset', { name: s.scenario }); } });
  if (SC.lanesFree) $('lanes').value = Math.round(num(s.lanes, 2, 8, DEFAULTS.lanes));
  pick('driver', s.driver); pick('mode', s.mode);
  if (typeof s.model === 'string' && s.model && $('model').options.length) {
    modelFallback = !hasOption($('model'), s.model);       // uložený model v nabídce není: následuje náhrada, kterou nikdo nevybral (bez jména modelu a s prázdnou nabídkou se příznak nemění)
    if (hasOption($('model'), s.model)) $('model').value = s.model;
    else { $('model').selectedIndex = 0; const used = $('model').value; notes.push({ key: 'model', get text() { return t('settings.noModel', { name: s.model, used }); } }); }
  }
  setSpeed(num(s.speed, 0.2, 12, DEFAULTS.speed));
  $('extra').checked = !!SC.hasExtra && s.extra === true;
  $('mirror').checked = s.mirror === true; $('inject').checked = s.inject === true;
  $('benchn').value = Math.round(num(s.benchn, 5, 1000, DEFAULTS.benchn));
  $('runlen').value = Math.floor(num(s.runlen, 0, 100000, DEFAULTS.runlen));
  $('seed').value = typeof s.seed === 'string' || typeof s.seed === 'number' ? String(s.seed).trim().slice(0, 40) : '';
  $('deadline').value = deadlineOf(s.deadline);            // prázdné, nesmyslné, 0 i záporné = bez limitu (prázdné pole)
  injectOn = $('inject').checked;                          // zaškrtávátko a vnitřní stav se po načtení shodují
  syncControls(); syncRun(); resetGame();                  // syncRun: vybraný hostovaný model bez potvrzení zamyká Start a benchmark
  return notes;
}

let saveTimer = null;
function saveSettings() {                                  // po každé změně ovládacího prvku; krátké zpoždění spojí sérii změn do jednoho zápisu
  clearTimeout(saveTimer);
  if (!settingsRead) return;                               // nenačtené nastavení se nepřepisuje tím, co je zrovna na stránce (viz renderDbNote)
  saveTimer = setTimeout(() => {
    const s = readSettings();
    if (!$('model').options.length || (modelFallback && hostedOf(s.model))) s.model = storedModel;  // prázdná nabídka modelů (Ollama neběžela) nebo hostovaný model, který nikdo nevybral: uložený model se nepřepíše
    api('POST', '/settings', { ...s, panel: readPanel(), ...(CONSENT.length ? { consent: CONSENT } : {}) }).then(dbOk, dbFail);
  }, 400);
}

// ---------- plánovač: fronta kroků ----------
// Krok = { kind: 'game' | 'bench', settings (úplné nastavení běhu), state, note, est }. Souhrn se neukládá: skládá ho stepLine při zobrazení
// v jazyce stránky. note = '' | věta chyby | { k, v } (viz cleanStepNote). Starý krok s uloženým polem summary se čte dál, pole se nepoužije.
// Pozor: prvek #queue a queueKey patří kartám e-mailů; plánovač má PLAN a prvky sq…
const STATES = ['wait', 'run', 'done', 'error', 'skip', 'abort'];      // platné stavy kroku; text stavu je state.<stav> v jazyce stránky
const PLAN_MAX = 200;                                      // nejvíc kroků ve frontě
let PLAN = { batch: 0, steps: [] };                        // batch = číslo posledního spuštění fronty
let planRunning = false;                                   // fronta právě běží: úpravy jsou zamčené

// Nastavení panelu plánovače (klíče = id prvků); ukládá se s posledním nastavením stránky pod klíčem panel.
const PANEL_DEFAULTS = { sqKind: 'game', pauseS: 60, pauseTemp: '', pauseCap: 10, lastBatch: false };
function readPanel() {
  const out = {};
  for (const id in PANEL_DEFAULTS) { const e = $(id); out[id] = e.type === 'checkbox' ? e.checked : e.type === 'number' ? (e.value === '' ? '' : +e.value) : e.value; }
  return out;
}
function applyPanel(saved) {                               // snese cokoli, stejně jako applySettings
  const s = { ...PANEL_DEFAULTS, ...(saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {}) };
  for (const id in PANEL_DEFAULTS) {
    const e = $(id), v = s[id];
    if (e.type === 'checkbox') e.checked = v === true;
    else if (e.type === 'number') {
      const ok = (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && Number.isFinite(+v);
      e.value = ok ? Math.min(+e.max, Math.max(+e.min, +v)) : PANEL_DEFAULTS[id];
    } else e.value = hasOption(e, v) ? v : PANEL_DEFAULTS[id];
  }
}

const sqSay = m => { sqMsg = m; $('sqStatus').textContent = say(m); };

function stepSummary(kind, s) {                            // čitelný souhrn kroku v jazyce stránky: kdo, scénář, pruhy, režim nebo benchmark, délka, semínko, volby
  const opt = (id, v) => [...$(id).options].find(o => o.value === v)?.text ?? String(v);        // texty voleb nese stránka v jazyce stránky sama
  const paid = s.driver === 'model' ? hostedOf(s.model) : null;
  const who = s.driver === 'model' ? (s.model || t('step.sum.noModel')) + (paid ? ` (${paid.who})` : '') : opt('driver', s.driver);
  const limit = deadlineOf(s.deadline);                    // souhrn říká, co opravdu poběží
  const how = kind === 'bench' ? (limit ? t('step.sum.benchLimit', { n: s.benchn, ms: limit }) : t('step.sum.bench', { n: s.benchn }))
    : s.mode === 'ladder' ? t('step.sum.ladder')
    : s.mode === 'turn' ? t('step.sum.turn', { len: s.runlen }) : t('step.sum.realtime', { speed: s.speed, len: s.runlen });
  const mirror = s.mirror && s.driver === 'model' && (kind === 'bench' || s.mode === 'turn');     // jinde se zrcadla nepoužijí
  const extras = [s.extra && t('step.sum.extra'), mirror && t('step.sum.mirror'), s.inject && t('step.sum.inject')].filter(Boolean);
  return [who, opt('scenario', s.scenario), t('step.sum.lanes', { n: s.lanes }), how, s.seed ? t('step.sum.seed', { seed: s.seed }) : t('step.sum.noSeed'), ...extras].join(' · ');
}

// Hostované kroky: odhad ceny při přidání kroku, kontrola stropu před spuštěním fronty, krátká prodleva místo pauzy na vychladnutí.
const EST_CHARS_PER_TOKEN = 3;                             // opatrně: anglický text má kolem 4 znaků na token
const HOSTED_MIN_MS = 100;                                 // odhad ve hře v reálném čase: rychleji hostovaný model přes síť neodpoví
let HOSTED_GAP = 2000;                                     // ms mezi kroky u hostovaného modelu; let, aby šla doba při ověřování zkrátit

function stepEstimate(kind, s) {                           // horní odhad dotazů a dolarů kroku s hostovaným modelem z aktuálního scénáře; jinak null
  const h = s.driver === 'model' ? hostedOf(s.model) : null;
  if (!h) return null;
  const rows = len => Math.ceil(len / (SC.gap ?? GAP)) + 1;
  let tasks;
  if (kind === 'bench') tasks = s.benchn;
  else if (s.mode === 'ladder') tasks = SC === obstacles ? Math.ceil(LADDER.reduce((t, v) => t + LEVEL / v, 0) * 1000 / HOSTED_MIN_MS) : rows(LADDER.length * LEVEL);
  else if (SC !== obstacles) tasks = rows(s.runlen);       // e-maily, číselné duely, zákazy a výjimky, paměťová stopa: jedna úloha na řadu
  else tasks = s.mode === 'turn' ? s.runlen + 1 : Math.ceil(s.runlen / s.speed * 1000 / HOSTED_MIN_MS);
  const mirror = s.mirror && (kind === 'bench' || s.mode === 'turn') && !SC.benchOnly;
  const requests = tasks * (mirror ? 3 : 1) + 1;           // + zahřívací dotaz
  const task = SC.warmTask(), note = s.inject && !SC.benchOnly ? Math.max(INJECT_NOTE.length, INJECT_NOTE_NOUL.length, INJECT_EMAIL.length) + 30 : 0;      // pokyn trojského koně s klíčem
  const chars = Math.max(...(mirror ? [0, 1, 2] : [0]).map(v =>                  // nejdelší varianta zadání
    JSON.stringify({ state: SC.stateOf?.(task, v) ?? task.state, questions: SC.questions(v, task) }).length)) + note;
  return { requests, usd: requests * Math.ceil(chars / EST_CHARS_PER_TOKEN) * h.usd_per_m / 1e6 };
}

async function overBudget(steps) {                         // proč frontu s těmito kroky nejde spustit: funkce, která větu složí v jazyce stránky (viz say); '' = jde
  const paid = steps.filter(st => st.settings.driver === 'model' && hostedOf(st.settings.model));
  if (!paid.length) return '';
  if (paid.some(st => !st.est)) return () => t('plan.over.noEstimate');
  let spend;
  try { spend = SPEND = await api('GET', '/spend'); }
  catch (e) { return () => t('plan.over.noSpend', { error: say(e.say || e.message) }); }      // věta ze serveru zůstává, jak přišla; větu stránky (viz apiError) složí say znovu
  const req = paid.reduce((n, st) => n + st.est.requests, 0), usd = paid.reduce((n, st) => n + st.est.usd, 0);
  if (spend.requests + req <= spend.max_requests && spend.usd + usd <= spend.max_usd) return '';
  return () => t('plan.over.cap', { requests: req, usd: usd.toFixed(4), spentRequests: spend.requests, spentUsd: spend.usd.toFixed(4),
                                    maxRequests: spend.max_requests, maxUsd: spend.max_usd });
}

// Popisek běžícího kroku (plan.label) se do hlášek fronty nepředává jako hotový text, ale jako proměnné at = { batch, step, total, left }:
// hláška je funkce, která větu složí celou v jazyce stránky, a po přepnutí jazyka ji renderLang složí znovu.
async function hostedGap(at) {                             // krok s hostovaným modelem: žádné chladnutí, jen krátká pevná prodleva
  sqSay(() => t('plan.pause.hosted', { label: t('plan.label', at) }));
  const t0 = performance.now();                            // měří se čas, ne počet kroků smyčky: skrytá záložka zpomaluje časovače a prodleva by se natáhla
  while (!planStop && performance.now() - t0 < HOSTED_GAP) await sleep(100);
}

// Frontu smí pouštět jen jedna záložka: druhá fronta naráz by si s první brala GPU a obě měření by byla k ničemu.
// Hlídá to zámek prohlížeče (Web Locks) — sám se uvolní, když záložka skončí. Bere si ho runPlan (úkol 10).
const PLAN_LOCK = 'pickbench-fronta';
async function planElsewhere() {                           // běží fronta v jiné záložce téhož prohlížeče?
  try { return !!navigator.locks && (await navigator.locks.query()).held.some(l => l.name === PLAN_LOCK); } catch (e) { return false; }
}

// Fronta z databáze → platná fronta. Krok ve stavu „běží“ se označí jako přerušený — kromě případu live = true
// (fronta právě běží v jiné záložce, krok tedy opravdu běží).
function cleanPlan(doc, live = false) {
  const plan = { batch: 0, steps: [] };
  let changed = false;
  if (!doc || typeof doc !== 'object' || Array.isArray(doc)) return { plan, changed };
  if (Number.isInteger(doc.batch) && doc.batch > 0 && doc.batch < 1e9) plan.batch = doc.batch;
  for (const st of Array.isArray(doc.steps) ? doc.steps.slice(0, PLAN_MAX) : []) {
    if (!st || typeof st !== 'object' || !['game', 'bench'].includes(st.kind) || !st.settings || typeof st.settings !== 'object') { changed = true; continue; }
    const step = { kind: st.kind, settings: st.settings, state: STATES.includes(st.state) ? st.state : 'wait', note: cleanStepNote(st.note) };
    if (st.est && typeof st.est === 'object' && Number.isFinite(st.est.requests) && Number.isFinite(st.est.usd) && st.est.requests >= 0 && st.est.usd >= 0)
      step.est = { requests: st.est.requests, usd: st.est.usd };
    if (step.state === 'run' && !live) { step.state = 'abort'; step.note = { k: 'abortReload', v: {} }; changed = true; }
    plan.steps.push(step);
  }
  return { plan, changed };
}

// Zápisy fronty jdou na server za sebou a každý nese stav z chvíle volání: dva zápisy těsně po sobě se tak nemohou
// prohodit (dřív po obnovení stránky občas krok „přerušeno“ místo „hotovo“). Nenačtená fronta se nepřepisuje:
// uložená by se ztratila i s číslem dávky.
let planSaving = Promise.resolve();
function savePlan() {
  if (!planRead) return;
  const doc = JSON.parse(JSON.stringify(PLAN));
  planSaving = planSaving.then(() => api('POST', '/queue', doc)).then(dbOk, dbFail);
}

function renderPlan() {                                    // texty jdou do stránky jako text
  $('sqList').replaceChildren(...PLAN.steps.map((st, i) => {
    const li = el('li', st.state), ops = el('span', 'ops');
    const btn = (text, label, op, off) => { const b = el('button', '', text); b.setAttribute('aria-label', label); b.disabled = planRunning || !!off; b.onclick = () => stepOp(i, op); ops.append(b); };
    btn('↑', t('step.up'), 'up', i === 0); btn('↓', t('step.down'), 'down', i === PLAN.steps.length - 1);
    btn(t('step.copy'), t('step.copyLabel'), 'copy', PLAN.steps.length >= PLAN_MAX);
    btn(t(st.state === 'done' || st.state === 'skip' ? 'step.again' : 'step.skip'), t('step.toggleLabel'), 'toggle');
    btn('×', t('step.removeLabel'), 'remove');
    li.append(ops, el('span', 'state', t('state.' + st.state)), el('span', 'sum', stepLine(st)), el('span', 'note', stepNoteText(st.note)));
    return li;
  }));
  for (const id of ['sqAdd', 'sqReset', 'sqClear', 'sqRun']) $(id).disabled = planRunning || !initDone;
  $('sqStop').disabled = !planRunning; syncLang();
  $('clear').disabled = resultsLocked();                   // fronta zapisuje výsledky; smazání uprostřed by rozbilo dávku
  for (const b of $('results').querySelectorAll('.rowdel button')) b.disabled = resultsLocked();      // stejně tlačítka v řádcích
  syncRun();                                               // za běhu fronty se ručně nespouští; před koncem načítání nic
  $('sqNote').textContent = [say(planWarn), PLAN.steps.some(st => st.kind === 'game' && st.state !== 'done' && st.state !== 'skip')
    ? t('plan.note.visible') : ''].filter(Boolean).join(' ');
}
function planChanged() { renderPlan(); savePlan(); }

function addStep() {                                       // krok z aktuálního nastavení ovládacích prvků
  const kind = $('sqKind').value, s = readSettings();
  const whole = (v, min, max) => Math.min(max, Math.max(min, Math.floor(v) || 0));
  s.deadline = deadlineOf(s.deadline);                     // readSettings ho už upravuje; tady je to pro jistotu, že krok ukládá, co poběží
  s.benchn = whole(s.benchn, 5, 1000); s.runlen = whole(s.runlen, 0, 100000);      // stejné meze jako applySettings: krok si uloží to, co opravdu poběží (0.5 pole by jinak běželo bez limitu)
  if (PLAN.steps.length >= PLAN_MAX) return sqSay(() => t('plan.full', { max: PLAN_MAX }));
  if (kind === 'game' && SC.benchOnly) return sqSay(() => t('plan.add.publicBench'));
  if (kind === 'game' && s.mode !== 'ladder' && !(s.runlen > 0)) return sqSay(() => t('plan.add.needsEnd'));
  if (s.driver === 'model' && !s.model) return sqSay(() => t('plan.add.noModel'));
  if (needConsent()) return sqSay(() => t('plan.add.consent'));
  const est = stepEstimate(kind, s);                       // jen u hostovaného modelu
  PLAN.steps.push({ kind, settings: s, state: 'wait', note: '', ...(est ? { est } : {}) });
  sqSay(''); planChanged();
}

function stepOp(i, op) {                                   // úpravy jednoho kroku fronty
  const st = PLAN.steps[i];
  if (!st || planRunning) return;
  if (op === 'up' && i > 0) PLAN.steps.splice(i - 1, 2, st, PLAN.steps[i - 1]);
  else if (op === 'down' && i < PLAN.steps.length - 1) PLAN.steps.splice(i, 2, PLAN.steps[i + 1], st);
  else if (op === 'copy' && PLAN.steps.length < PLAN_MAX) PLAN.steps.splice(i + 1, 0, { kind: st.kind, settings: { ...st.settings }, state: 'wait', note: '',
                                                                                       ...(st.est ? { est: { ...st.est } } : {}) });
  else if (op === 'toggle') { st.state = st.state === 'done' || st.state === 'skip' ? 'wait' : 'skip'; st.note = ''; }
  else if (op === 'remove') PLAN.steps.splice(i, 1);
  else return;
  planChanged();
}

$('sqAdd').onclick = addStep;
$('sqClear').onclick = () => { if (!planRunning) { PLAN.steps = []; sqSay(''); planChanged(); } };
$('sqReset').onclick = () => { if (!planRunning) { for (const st of PLAN.steps) { st.state = 'wait'; st.note = ''; } planChanged(); } };

// ---------- plánovač: běh fronty ----------
let planStop = false;                                      // uživatel frontu zastavil
let planWarn = '';                                         // upozornění plánovače (obrazovku nejde udržet zapnutou): '' nebo funkce, která větu složí v jazyce stránky (viz holdScreen)
let runTag = null;                                         // { batch, step, note } právě běžícího kroku fronty (note = seznam [klíč, proměnné], viz addResult); mimo frontu null
let lastRec = null;                                        // záznam, který zapsal poslední běh (null = nezapsal nic)
let onRunEnd = null;                                       // plánovač čeká na konec běhu
let wakeLock = null;

// Skrytá záložka zastaví animaci: krok ve hře by nikdy nedojel na délku průjezdu a fronta by stála do rána.
// Je-li záložka během kroku fronty ve hře skrytá déle než HIDDEN_MAX, krok skončí chybou a fronta jde dál.
// Hlídá to setTimeout (ten běží i ve skryté záložce), ne animace. Benchmarku bez hry ani ručního běhu se to netýká.
let HIDDEN_MAX = 60000;                                    // ms; let, aby šla doba při ověřování zkrátit
let hiddenTimer = null;
const hiddenStep = () => document.hidden && planRunning && running && runKind === 'game' && !!runTag;
function watchHidden() {                                   // volá se při změně viditelnosti a na začátku i konci každého běhu
  clearTimeout(hiddenTimer); hiddenTimer = null;
  if (!hiddenStep()) return;
  hiddenTimer = setTimeout(() => {
    hiddenTimer = null;
    if (!hiddenStep()) return;
    const s = Math.round(HIDDEN_MAX / 1000);
    fail(() => t('plan.err.hidden', { s })); stop();
  }, HIDDEN_MAX);
}

let runError = '';                                         // věta chyby, kterou skončil poslední běh; platí jen při runWhy === 'error'
// Běh končí chybou: věta jde do stavu i do kroku fronty. message je věta ze serveru nebo z výjimky (text; zůstává, jak přišla), nebo funkce, která složí větu
// stránky: ve stavu se po přepnutí jazyka složí znovu, do kroku fronty (runError) jde jako text v jazyce, ve kterém vznikla. Úvod ve stavu se překládá vždy.
function fail(message) { runError = say(message); runWhy = 'error'; if (typeof message === 'function') return status(() => t('run.error', { message: message() })); status(() => t('run.error', { message })); }
function finishRun() {                                     // volá se na konci každého běhu (hra i benchmark)
  const done = onRunEnd; onRunEnd = null;
  if (done) done({ why: runWhy, rec: lastRec, error: runWhy === 'error' ? runError : '' });
}
function runStep(st) {                                     // spustí krok a počká na jeho konec
  return new Promise(resolve => {
    onRunEnd = resolve;
    Promise.resolve().then(st.kind === 'bench' ? benchmark : start).catch(e => {      // chyba mimo běh samotný: krok skončí chybou, fronta nezůstane viset
      fail(e.message);
      if (running) stop(); else finishRun();
    });
  });
}

async function gpuNow() {                                  // jedno čtení /gpu pro plánovač, i když záložka není vidět
  try { return await api('GET', '/gpu', undefined, 4000); } catch (e) { return { available: false }; }
}
async function unloadModel(name) {                         // neúspěch frontu nezastaví, jen se poznamená
  try { await api('POST', '/unload', { model: name }, 35000); return ''; }
  catch (e) { return ['unload', { model: name, error: e.message }]; }
}

// Pauza před krokem: nejméně zadaný čas a zároveň dokud GPU není pod cílovou teplotou; čekání na teplotu má strop.
// Vrací poznámku, když krok začíná teplejší, jinak ''. at = proměnné popisku kroku (viz hostedGap).
async function coolDown(at) {
  const p = readPanel(), lim = (v, max) => Math.min(max, Math.max(0, +v || 0));       // meze polí platí i pro hodnotu napsanou ručně: pauza nejvýš hodinu, strop nejvýš 4 hodiny
  const secs = lim(p.pauseS, 3600), target = p.pauseTemp === '' ? null : +p.pauseTemp, capS = lim(p.pauseCap, 240) * 60;
  const t0 = performance.now();
  let misses = 0, temp = null;
  while (!planStop) {
    if (target !== null && misses < HW_GIVE_UP) {
      const g = await gpuNow();
      if (planStop) break;
      if (g.available && Number.isFinite(g.temp_c)) { temp = g.temp_c; misses = 0; } else { temp = null; misses++; }
    }
    const waited = (performance.now() - t0) / 1000;
    const useTemp = target !== null && misses < HW_GIVE_UP;                // GPU třikrát po sobě neodpověděla → platí jen čas
    const cool = !useTemp || (temp !== null && temp < target), timeUp = waited >= secs;
    if (timeUp && cool) return '';
    if (timeUp && waited >= capS) return ['hot', { temp: temp ?? '?', target }];
    const key = timeUp ? 'plan.pause.temp' : useTemp ? 'plan.pause.both' : 'plan.pause.time';      // čeká se už jen na teplotu, na čas i teplotu, nebo jen na čas
    const vars = { s: Math.ceil(secs - waited), temp: temp ?? '?', target, cap: Math.max(0, Math.ceil(capS - waited)) };
    sqSay(() => t(key, { label: t('plan.label', at), ...vars }));
    await sleep(1000);
  }
  return '';
}

async function holdScreen() {                              // po dobu fronty nenechat zhasnout obrazovku; když to nejde, vrací funkci, která větu složí v jazyce stránky (viz say), jinak ''
  try {
    if (!navigator.wakeLock) { wakeLock = null; return () => t('plan.screen.warn', { error: t('plan.screen.unsupported') }); }
    wakeLock = await navigator.wakeLock.request('screen');
    return '';
  } catch (e) { wakeLock = null; return () => t('plan.screen.warn', { error: e.message }); }      // hláška prohlížeče zůstává, jak přišla
}
function releaseScreen() { if (wakeLock) wakeLock.release().catch(() => {}); wakeLock = null; }

const resultNote = rec => ({ k: 'result', v: { n: rec.data.vals.n, acc: rec.data.vals.acc, avg: rec.data.vals.avg } });
const stepLine = st => stepSummary(st.kind, { ...DEFAULTS, ...st.settings })      // souhrn kroku v jazyce stránky; u hostovaného modelu s odhadem ceny
  + (st.est ? t('step.est', { requests: st.est.requests, usd: st.est.usd.toFixed(4) }) : '');

let planRelease = null;                                    // uvolní zámek fronty (PLAN_LOCK), který tato záložka drží
function holdPlan() {                                      // true = frontu teď pouští tato záložka; false = už běží v jiné
  if (!navigator.locks) return Promise.resolve(true);      // prohlížeč zámky neumí: nehlídá se
  return new Promise(resolve => {
    navigator.locks.request(PLAN_LOCK, { ifAvailable: true }, lock => {
      if (!lock) return resolve(false);
      resolve(true);
      return new Promise(release => { planRelease = release; });       // zámek drží, dokud fronta neskončí nebo se záložka nezavře
    }).catch(() => resolve(true));
  });
}
function releasePlan() { if (planRelease) planRelease(); planRelease = null; }

async function runPlan() {
  if (planRunning) return;
  if (running) return sqSay(() => t('plan.run.busy'));
  const todo = PLAN.steps.filter(st => st.state === 'wait' || st.state === 'abort' || st.state === 'error');
  if (!todo.length) return sqSay(() => t('plan.run.nothing'));
  planRunning = true; renderPlan();                        // hned: druhé kliknutí během čekání na zámek nic nespustí a ovládání je zamčené od první chvíle
  const over = await overBudget(todo);                     // hostované kroky: odhad + dosavadní útrata nesmí překročit strop serveru
  if (over) { planRunning = false; renderPlan(); return sqSay(over); }
  if (!(await holdPlan())) { planRunning = false; renderPlan(); return sqSay(() => t('plan.run.elsewhere')); }
  for (const st of todo) { st.state = 'wait'; st.note = ''; }
  PLAN.batch = Math.max(PLAN.batch, ...RESULTS.map(r => Number.isInteger(r.data.batch) ? r.data.batch : 0)) + 1;   // vždy vyšší než dávky v tabulce, i kdyby se počitadlo ve frontě ztratilo
  planStop = false; planWarn = '';
  let crash = '';
  try {
    planChanged();
    planWarn = await holdScreen(); renderPlan();
    let prevModel = null;
    for (let i = 0; i < PLAN.steps.length && !planStop; i++) {
      const st = PLAN.steps[i];
      if (st.state !== 'wait') continue;
      const left = PLAN.steps.slice(i + 1).filter(s => s.state === 'wait').length;
      const at = { batch: PLAN.batch, step: i + 1, total: PLAN.steps.length, left };      // proměnné popisku kroku (plan.label)
      st.state = 'run'; planChanged(); sqSay(() => t('plan.label', at));
      try {
        const use = async () => {                          // nastavit ovládací prvky podle kroku; co nejde obnovit, je chyba kroku (věta se ukládá s krokem v jazyce, ve kterém vznikla)
          const missing = (await applySettings(st.settings)).filter(n => n.key === 'scenario' || st.settings.driver === 'model');
          if (missing.length) throw new Error(missing.map(n => n.text).join('; '));
          if (st.settings.driver === 'model' && !$('model').value) throw new Error(t('plan.err.noModels'));
          if (needConsent()) throw new Error(t('hosted.consentNeeded'));
          if (st.kind === 'game' && SC.benchOnly) throw new Error(t('plan.err.publicGame'));
          if (st.kind === 'game' && $('mode').value !== 'ladder' && !(+$('runlen').value > 0))      // třeba krok z poškozené fronty
            throw new Error(t('plan.err.noEnd'));
        };
        await use();
        const model = st.settings.driver === 'model' ? $('model').value : null;
        const notes = [];
        if (prevModel && prevModel !== model) { if (!hostedOf(prevModel)) notes.push(await unloadModel(prevModel)); prevModel = null; }      // hostovaný model v paměti Ollamy není
        if (model && hostedOf(model)) await hostedGap(at); else notes.push(await coolDown(at));
        if (planStop) { st.state = 'wait'; break; }
        await use();                                       // znovu: během pauzy mohl někdo sáhnout na ovládací prvky
        if (planStop) { st.state = 'wait'; break; }        // zastavení během nastavování platí stejně jako během pauzy
        if (model) prevModel = model;
        runTag = { batch: PLAN.batch, step: i + 1, note: notes.filter(Boolean) };
        sqSay(() => t('plan.running', { label: t('plan.label', at), summary: stepLine(st) }));
        const end = await runStep(st);
        if (end.why === 'error') { st.state = 'error'; st.note = end.error; }
        else if (end.why === 'stop') { st.state = 'abort'; st.note = { k: planStop ? 'abortQueue' : 'abortStop', v: {} }; }
        else if (!end.rec || !(end.rec.data.vals.n > 0)) { st.state = 'error'; st.note = { k: 'empty', v: {} }; }
        else { st.state = 'done'; st.note = resultNote(end.rec); }
      } catch (e) { st.state = 'error'; st.note = e.message; }
      runTag = null; planChanged();
    }
  } catch (e) {                                            // nečekaná chyba mimo krok: fronta nesmí zůstat viset ve stavu „běží“
    crash = e.message;
    for (const st of PLAN.steps) if (st.state === 'run') { st.state = 'error'; st.note = crash; }
  } finally {
    runTag = null; planRunning = false; releaseScreen(); releasePlan();
  }
  const waiting = PLAN.steps.filter(st => st.state === 'wait').length, batch = PLAN.batch;       // hodnoty z konce fronty: větu z nich po přepnutí jazyka složí renderLang znovu
  sqSay(crash ? () => t('plan.end.crash', { error: crash }) : planStop ? () => t('plan.end.stopped', { n: waiting }) : () => t('plan.end.done', { batch }));
  planWarn = ''; planChanged();
}

function stopPlan() {                                      // ukončí běžící krok a další nespustí
  if (!planRunning) return;
  planStop = true; sqSay(() => t('plan.stopping'));
  if (running) stop();
}

$('sqRun').onclick = runPlan; $('sqStop').onclick = stopPlan;
$('lastBatch').onchange = renderResults;
document.addEventListener('visibilitychange', () => {       // Wake Lock se při skrytí záložky ruší; po návratu si ho fronta vezme znovu
  watchHidden();
  if (planRunning && !document.hidden) holdScreen().then(w => { planWarn = w; renderPlan(); });
});

// ---------- hardware: stav GPU z /gpu, energie na rozhodnutí ----------
const HW_MIN_SAMPLES = 5, HW_MAX_GAP = 5, HW_GIVE_UP = 3;  // energie až od 5 vzorků a bez mezery nad 5 s; po 3 neúspěších po sobě se GPU prohlásí za chybějící
const THROTTLE_MHZ = 400, THROTTLE_MS = 5000, THROTTLE_UTIL = 50;   // přiškrcená GPU: pod zátěží takt pod 400 MHz déle než 5 s (varování je text hw.throttled)
let HW = null;                                             // poslední odpověď /gpu
let hwSeen = false, hwMisses = 0, hwOff = false;           // GPU už byla vidět / neúspěchy po sobě / dotazy na /gpu skončily
let hwBusy = false, hwTimer = null;
let hwLoad = false;                                        // běží měřená část běhu s řidičem Model
let hwLow = null;                                          // čas (ms), od kdy je takt pod zátěží pod prahem
let hwThrottled = false;                                   // v tomto (nebo posledním) běhu byla GPU přiškrcená; varování zůstává do začátku dalšího běhu

// vzorky [čas s, příkon W, teplota °C], n = počet rozhodnutí, t0 a t1 = začátek a konec běhu v s (stejné hodiny jako vzorky)
function energyOf(samples, n, t0, t1) {
  const temps = samples.map(s => s[2]).filter(t => Number.isFinite(t)), p = samples.filter(s => Number.isFinite(s[1]));
  const out = { joules: NaN, perDecision: NaN, avgPower: NaN, maxTemp: temps.length ? Math.max(...temps) : NaN };
  if (p.length < HW_MIN_SAMPLES) return out;
  let sum = 0;
  for (let i = 1; i < p.length; i++) {
    const dt = p[i][0] - p[i - 1][0];
    if (dt > HW_MAX_GAP) return out;                       // díra ve vzorcích (skrytá záložka): energii nejde spočítat
    sum += (p[i][1] + p[i - 1][1]) / 2 * dt;               // průměrný příkon × interval mezi vzorky
  }
  const span = p[p.length - 1][0] - p[0][0];
  if (!(span > 0) || !(p[0][0] - t0 <= HW_MAX_GAP) || !(t1 - p[p.length - 1][0] <= HW_MAX_GAP)) return out;   // vzorky nepokrývají začátek nebo konec běhu
  const avgPower = sum / span, joules = avgPower * (t1 - t0);        // na celý běh: jinak by se energie části běhu dělila všemi rozhodnutími
  return { ...out, joules, perDecision: n ? joules / n : NaN, avgPower };
}
function runEnergy(now = performance.now()) {              // energie právě běžícího (nebo posledního) běhu
  const e = energyOf(S.hw, S.n, S.t0 / 1000, (S.t1 ?? now) / 1000);
  const hosted = !!(runSettings && runSettings.driver === 'model' && hostedOf(runSettings.model));
  if (runSettings && runSettings.driver === 'model' && !hosted) return e;
  return { ...e, joules: NaN, perDecision: NaN, avgPower: NaN,       // Pravidla a Náhodně: byl by to jen klidový příkon GPU, který vypadá jako výsledek
           ...(hosted ? { maxTemp: NaN } : {}) };                    // hostovaný model: GPU tohoto počítače s během nesouvisí vůbec, ani teplota
}

function renderHw(now = performance.now()) {               // texty se berou při každém kreslení: po přepnutí jazyka panel překreslí drawStats, jinak každý vzorek GPU
  if (hostedNow() || (running && runHosted)) { $('hw').replaceChildren(el('div', '', t('hosted.hw'))); $('hwWarn').textContent = ''; return; }
  if (hwOff) { $('hw').replaceChildren(el('div', '', t('hw.none'))); $('hwWarn').textContent = ''; return; }
  const g = HW && HW.available ? HW : {}, e = runEnergy(now);
  const unit = (x, u, d = 0) => Number.isFinite(x) ? `${x.toFixed(d)} ${u}` : '—';
  renderTiles($('hw'), [
    [unit(g.temp_c, '°C'), t('tile.hwTemp.label'), t('tile.hwTemp')], [unit(g.power_w, 'W', 1), t('tile.hwPower.label'), t('tile.hwPower')],
    [unit(g.clock_mhz, 'MHz'), t('tile.hwClock.label'), t('tile.hwClock')], [typeof g.pstate === 'string' ? g.pstate : '—', t('tile.hwPstate.label'), t('tile.hwPstate')],
    [unit(g.mem_mb, 'MB'), t('tile.hwMem.label'), t('tile.hwMem')],
    [f(e.perDecision, e.perDecision < 10 ? 2 : 1), t('tile.hwJoule.label', { wh: f(e.joules / 3600, 3) }), t('tile.hwJoule')],
    [unit(e.avgPower, 'W', 1), t('tile.hwAvgPower.label'), t('tile.hwAvgPower')], [unit(e.maxTemp, '°C'), t('tile.hwMaxTemp.label'), t('tile.hwMaxTemp')],
  ]);
  $('hwWarn').textContent = hwThrottled ? t('hw.throttled') : '';
}

function gpuSample(g, now = performance.now()) {           // zpracuje jednu odpověď /gpu (zvlášť, aby šlo ověřit i bez GPU)
  HW = g;
  if (g && g.available) {
    hwSeen = true; hwMisses = 0;
    if (running) S.hw.push([now / 1000, g.power_w, g.temp_c]);
    const idle = Number.isFinite(g.util_pct) && g.util_pct < THROTTLE_UTIL;      // nízký takt při nečinnosti mezi rozhodnutími není přiškrcení
    const low = hwLoad && !idle && Number.isFinite(g.clock_mhz) && g.clock_mhz < THROTTLE_MHZ;
    hwLow = low ? hwLow ?? now : null;
    if (hwLow !== null && now - hwLow > THROTTLE_MS) hwThrottled = true;         // běh je poznamenaný celý, i když se takt potom vrátí
  } else if (!hwSeen && ++hwMisses >= HW_GIVE_UP) hwOff = true;      // jedno selhání může být jen pomalé probuzení karty
  renderHw(now);
}

// ---------- jádro: kreslení ----------
const ctx = $('road').getContext('2d');
function draw(g) {
  ctx.fillStyle = g.flash > 0 ? `rgb(${32 + 120 * g.flash},38,45)` : '#20262d'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#4a5663'; ctx.lineWidth = 2; ctx.setLineDash([18, 18]); ctx.lineDashOffset = -(g.dist * CELL) % 36;
  for (let i = 1; i < LANES; i++) { ctx.beginPath(); ctx.moveTo(i * LW, 0); ctx.lineTo(i * LW, H); ctx.stroke(); }
  ctx.setLineDash([]);
  SC.drawItems(g);
  const pose = SC.carPose?.(g);                            // dva kroky dopředu: poloha auta z trasy bloku (bez vyhlazování) a průhlednost vraku
  g.visLane = pose ? pose.lane : g.visLane + (g.lane - g.visLane) * 0.35;
  const x = g.visLane * LW + LW * 0.24, w = LW * 0.52, h = SC.carH ?? 44;   // výška auta v px: scénář ji smí zmenšit
  for (const lane of g.ghosts || []) if (lane >= 0) {       // zrcadla: kam by jely zbylé dvě varianty zadání (při shodě schované pod autem)
    ctx.globalAlpha = 0.45; ctx.fillStyle = '#e69f00';
    ctx.beginPath(); ctx.roundRect(lane * LW + LW * 0.24, CAR_Y - h / 2, w, h, Math.min(9, h / 3)); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.globalAlpha = pose?.alpha ?? 1;
  ctx.fillStyle = '#4cc2ff'; ctx.beginPath(); ctx.roundRect(x, CAR_Y - h / 2, w, h, Math.min(9, h / 3)); ctx.fill();
  ctx.fillStyle = '#0b2536'; ctx.fillRect(x + w * 0.13, CAR_Y - h * 13 / 44, w * 0.74, h * 10 / 44);
  ctx.globalAlpha = 1;
  SC.drawVehicle?.(g, x, w);                               // zákazy a výjimky: štítek vozidla pod autem; závora: brzdová světla; ostatní scénáře nic
  SC.drawTrail?.(g);                                       // paměťová stopa: pás historie pod silnicí; ostatní scénáře nic
  if (g.flash > 0) g.flash = Math.max(0, g.flash - 0.05);
}

let runId = 0, running = false, runKind = 'game';          // 'game' | 'bench'

let mirrorOn = false;                                      // zrcadla v právě běžícím (nebo posledním) běhu
let runLimit = 0;                                          // délka průjezdu právě běžící (nebo poslední) hry v polích; 0 = bez limitu (i žebřík a benchmark)
let runWhy = '';                                           // proč poslední běh skončil: 'limit' | 'ladder' | 'done' | 'stop' | 'error'; za běhu ''

// Zastavení u závory: G.hold = { row, from, until } v ms skutečného času; řada nese hold 1 (auto stojí) a 2 (dostálo).
function startHold(stop, now) {
  G.hold = { row: stop.row, from: now, until: now + stop.ms };
  stop.row.hold = 1;
}
function endHold(now) {
  S.held += now - G.hold.from;
  G.hold.row.hold = 2;
  G.hold = null;
}
function runSecs(now) {                                    // doba běhu v s bez stání u závory (i toho, které právě běží)
  return (now - S.t0 - S.held - (G?.hold ? now - G.hold.from : 0)) / 1000;
}

function drive(cells) {                                    // posun běžící hry; na délce průjezdu běh sám skončí; vrací ujetá pole (při stání 0)
  if (!running) return 0;
  const now = performance.now();
  if (G.hold) { if (now < G.hold.until) return 0; endHold(now); }
  const end = runLimit + 1e-6;                             // o chlup za limit: řada přesně na něm se ještě započítá
  if (runLimit) cells = Math.min(cells, end - G.dist);
  const halt = SC.stopAhead?.(G) ?? null, holdNow = halt !== null && halt.cells <= cells;   // závora: auto dojede k bodu zastavení a stojí
  if (holdNow) cells = halt.cells;
  if (cells > 0) step(G, cells);
  if (holdNow) startHold(halt, now);
  if (runLimit && G.dist >= end - 1e-9) { runWhy = 'limit'; stop(); }
  return Math.max(0, cells);
}

// Žebřík: rychlost stoupá po úrovních; úroveň = LEVEL polí, zvládnutá při nejvýš 1 chybě.
const LADDER = [1, 1.2, 1.6, 2, 2.4, 3, 3.8, 4.8, 6, 7.6, 9.6, 12], LEVEL = 60;
let ladder = null;                                         // { i: úroveň, from: ujeto na začátku úrovně, err: chyb na začátku, best: nejvyšší zvládnutá rychlost }

function syncControls() {                                  // co jde měnit jen v některém scénáři nebo režimu
  $('lanes').disabled = running || !SC.lanesFree;
  const lanes = $('lanes');                                // závora a skryté pravidlo: zamčený volič ukazuje pevný počet pruhů, volba uživatele se vrátí
  if (SC.fixedLanes) { lanes.dataset.free ??= lanes.value; lanes.value = SC.fixedLanes; }
  else if (lanes.dataset.free !== undefined) { lanes.value = lanes.dataset.free; delete lanes.dataset.free; }
  for (const o of lanes.options) o.disabled = +o.value < (SC.minLanes ?? 2) || +o.value > (SC.maxLanes ?? 8);     // dva kroky dopředu: od 3 pruhů; mýtné brány: 4 nebo 5; nejdřív návrat volby, pak meze
  if (+lanes.value < (SC.minLanes ?? 2)) lanes.value = SC.minLanes;
  if (+lanes.value > (SC.maxLanes ?? 8)) lanes.value = SC.maxLanes;
  $('extra').disabled = running || !SC.hasExtra;
  $('speed').disabled = running && $('mode').value === 'ladder';
  $('mirror').disabled = $('inject').disabled = running || !!SC.benchOnly;      // veřejná sada: zrcadla ani trojský kůň nejsou
  if (SC.benchOnly) $('mirror').checked = $('inject').checked = false;
}
function syncRun() {                                       // Start a Spustit benchmark; před koncem načítání stránky a za běhu nic, u veřejné sady jen benchmark
  renderHosted();
  const off = running || planRunning || !initDone || needConsent();
  $('bench').disabled = off; $('start').disabled = off || !!SC.benchOnly;
}
function setRunning(on) {
  running = on;
  if (!on) { hwLoad = false; hwLow = null; }
  syncRun(); syncLang(); $('stop').disabled = !on;
  ['driver', 'model', 'mode', 'scenario', 'mirror', 'inject', 'seed', 'runlen', 'deadline'].forEach(id => $(id).disabled = on);
  syncControls();

}
// Hláška stavu je text, nebo funkce, která ho složí v jazyce stránky: po přepnutí jazyka se zavolá znovu (renderLang).
const say = m => typeof m === 'function' ? m() : m;
let statusMsg = '', sqMsg = '';
const status = m => { statusMsg = m; $('status').textContent = say(m); };

function ladderStatus() {                                  // stav za jízdy žebříkem; hodnoty z chvíle volání, aby větu po přepnutí jazyka šlo složit znovu
  const at = { level: ladder.i + 1, total: LADDER.length, speed: LADDER[ladder.i] };
  status(() => t('run.ladder.level', at));
}
function ladderLevelDone() {                               // konec úrovně: postup, nebo konec běhu
  const errs = SC.errors(G) - ladder.err;
  if (errs <= 1) ladder.best = LADDER[ladder.i];
  if (errs > 1 || ladder.i === LADDER.length - 1) { ladder.done = true; return stop(); }
  ladder.i++; ladder.from = G.dist; ladder.err = SC.errors(G);
  setSpeed(LADDER[ladder.i]);

}

}

async function advance(id, cells) {                        // režim po tazích: popojet plynule o daný počet polí
  const n = Math.max(1, Math.ceil(cells * 6)), part = cells / n;
  let left = cells;                                        // sčítá skutečně ujetá pole: během stání u závory drive vrací 0 a smyčka čeká
  while (left > 1e-9 && id === runId) { left -= drive(Math.min(part, left)); await sleep(20); }
}

async function start() {
  if (SC.benchOnly) { fail(() => t('public.benchOnly')); lastRec = null; finishRun(); return; }      // fronta se o konci dozví, i když běh nezačal
  if (needConsent()) { fail(() => t('hosted.consentNeeded')); lastRec = null; finishRun(); return; }    // bez potvrzení varování neodejde ani zahřívací dotaz
  const id = ++runId, driver = $('driver').value, mode = $('mode').value, realtime = mode !== 'turn';
  runSettings = readSettings();                            // před žebříkem: ten si rychlost přepisuje
  mirrorOn = $('mirror').checked && driver === 'model' && mode === 'turn';       // v reálném čase by tři dotazy na úlohu měřily něco jiného
  ladder = mode === 'ladder' ? { i: 0, from: 0, err: 0, best: null, done: false, prev: $('speed').value } : null;
  if (ladder) setSpeed(LADDER[0]);
  injectOn = $('inject').checked;
  runLimit = ladder ? 0 : Math.max(0, Math.floor(+$('runlen').value) || 0);      // žebřík má vlastní konec
  runWhy = ''; lastRec = null; status('');
  runDeadline = 0;                                         // ve hře je limitem příjezd řady, ne pole
  runHosted = driver === 'model' ? hostedOf($('model').value) : null; runNet = NaN;
  seedRng($('seed').value);                                // před resetGame: první řada vzniká už v něm
  runKind = 'game'; setRunning(true); resetGame();
  try {
    if (driver === 'model') await warmup();
    if (id !== runId) return;
    S = newStats(); hwLoad = driver === 'model' && !runHosted; hwThrottled = false;
    if (ladder) ladderStatus();                            // první úroveň
    let last = performance.now();
    (function frame(now) {                                  // animační smyčka
      if (id !== runId) return;

        for (let dt = Math.min(1, (now - last) / 1000); dt > 0; dt -= 0.03) drive(+$('speed').value * Math.min(0.03, dt));
      if (id !== runId) return;                              // běh skončil na délce průjezdu
      last = now; draw(G);

      if (ladder && G.dist - ladder.from >= LEVEL) ladderLevelDone();
      requestAnimationFrame(frame);
    })(last);
    while (id === runId) {                                  // rozhodovací smyčka
      if (G.hold) { drive(0); await sleep(15); continue; }   // závora: auto stojí, nový dotaz neodchází; drive(0) zastavení po tazích ukončí
      const eta = realtime ? +$('speed').value * pct(S.lat.slice(-10), .5) / 1000 : 0;   // polí ujetých během jednoho očekávaného rozhodnutí
      const task = SC.nextTask(G, eta || 0);

function stop() {

  const now = performance.now();

  if (runKind === 'bench') { addResult({ mode: 'bench', aborted: true }, false); renderStats(false); finishRun(); return; }
  if (runWhy === 'limit') { const n = runLimit; status(() => t('run.limitDone', { n })); }      // hodnoty z konce běhu: větu z nich po přepnutí jazyka složí renderLang znovu (stejně žebřík níž)
  const mode = $('mode').value;
  addResult(ladder ? { mode: 'ladder', aborted: !ladder.done, best: ladder.best } : mode === 'realtime' ? { mode: 'realtime', speed: $('speed').value } : { mode: 'turn' }, true);
  if (ladder) {

    if (ladder.done) status(best ? () => t('run.ladder.best', { best }) : () => t('run.ladder.none'));
    else if (runWhy !== 'error') status(best ? () => t('run.ladder.interrupted', { best }) : () => t('run.ladder.interruptedNone'));
    setSpeed(ladder.prev);                                 // vrátit rychlost nastavenou před žebříkem
  }

  renderStats(true); G.flash = 0; draw(G);

}

async function init() {                                    // až jsou nabídky modelů a sad: poslední nastavení a výsledky z databáze
  try {
    await Promise.all([modelsReady, datasetsReady]);
    if (Object.keys(HOSTED).length) try { SPEND = await api('GET', '/spend'); } catch (e) { SPEND = null; }      // jen když server hostované modely nabízí
    const first = statusMsg;                               // hláška o nedostupné Ollamě nebo serveru zůstane vidět (text ze serveru, nebo funkce, která větu stránky složí)
    let saved = null, read = false;
    try { saved = (await api('GET', '/settings')).settings; read = true; dbOk(); } catch (e) { dbFail(e); }
    storedModel = saved && typeof saved.model === 'string' ? saved.model : '';
    CONSENT = cleanConsent(saved && saved.consent);          // před applySettings: ten podle souhlasu zamyká Start
    const notes = await applySettings(saved);
    applyPanel(saved && saved.panel);
    settingsRead = read;                                   // až teď: ovládací prvky ukazují to, co bylo uložené, a jejich změna to smí přepsat
    try { RESULTS = cleanResults((await api('GET', '/results')).results); } catch (e) { dbFail(e); }
    renderResults();
    try {
      const live = await planElsewhere();                  // fronta běží v jiné záložce: její krok „běží“ doopravdy a do databáze se odsud nesahá
      const loaded = cleanPlan((await api('GET', '/queue')).queue, live);
      PLAN = loaded.plan; planRead = true;
      if (loaded.changed && !live) savePlan();             // krok, který při zavření stránky běžel, je teď „přerušeno“
      if (live) sqSay(() => t('plan.live'));
    } catch (e) { dbFail(e); }
    status(() => [say(first), ...notes.map(n => n.text)].filter(Boolean).join(' · '));      // poznámky applySettings mají text jako getter: po přepnutí jazyka se celá hláška složí znovu
  } catch (e) {                                            // nečekaná chyba: ať je vidět i na stránce, ne jen v konzoli
    dbFail(() => t('run.initFailed', { error: e.message })); throw e;      // hláška prohlížeče zůstává, jak přišla; větu kolem ní složí stránka v jazyce, který zrovna má
  } finally {                                              // i po chybě: tlačítka se odemknou a co se nenačetlo, řekne hláška pod tabulkou
    initDone = true; renderPlan(); renderDbNote();
    document.querySelector('main').addEventListener('change', e => { if (e.target.id in DEFAULTS || e.target.id in PANEL_DEFAULTS) saveSettings(); });
    renderLang();                                          // jazyk přepnutý během načítání: co se vykreslilo dřív (popis, dlaždice, grafy, popisek Startu), dostane jazyk stránky; až tady, aby výjimka z překreslení nezabránila registraci výš
  }
}
renderLang();                                              // záhlaví tabulky, popisky a všechny texty v jazyce stránky
const ready = init();                                      // úryvky pro ověření na něj čekají: await ready
</script>
</body>
</html>
