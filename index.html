// ---------- scénář: paměťová stopa ----------
// Řada bran se značkami; každá řada je samostatná úloha s vlastní historií, N a okénkem bran (memoryRow ve sdíleném bloku).
// Historie je ve stavu, model nic nepamatuje. Na silnici a v pásu historie je značka jen symbol pro diváka; model dostává slovo.
const MEMORY_GLYPH = { moon: '🌙', heart: '❤️', bell: '🔔', leaf: '🍃' };     // emoji potřebují barevné písmo jako vozidla u zákazů; ostatní symboly kreslí cesta
const memoryGlyph = name => MEMORY_GLYPH[name] ?? '?';
function drawMemorySign(c, name, x, y, rad) {              // symbol značky na plátno c; volající nastaví textAlign = 'center', textBaseline = 'middle'
  const poly = pts => { c.beginPath(); pts.forEach(([px, py], i) => c[i ? 'lineTo' : 'moveTo'](x + px * rad, y + py * rad)); c.closePath(); c.fill(); };
  const ring = (k, r = 1, a0 = -Math.PI / 2) => [...Array(k)].map((_, i) => [r * Math.cos(a0 + i * 2 * Math.PI / k), r * Math.sin(a0 + i * 2 * Math.PI / k)]);
  c.fillStyle = '#e6edf3';
  switch (name) {
    case 'circle': c.beginPath(); c.arc(x, y, rad * 0.85, 0, 7); c.fill(); break;
    case 'square': c.fillRect(x - rad * 0.75, y - rad * 0.75, rad * 1.5, rad * 1.5); break;
    case 'star': poly(ring(10).map(([px, py], i) => i % 2 ? [px * 0.42, py * 0.42] : [px, py])); break;
    case 'triangle': poly(ring(3).map(([px, py]) => [px, py + 0.15])); break;
    case 'arrow': poly([[-0.9, -0.25], [0.1, -0.25], [0.1, -0.7], [0.95, 0], [0.1, 0.7], [0.1, 0.25], [-0.9, 0.25]]); break;
    case 'cross': c.fillRect(x - rad * 0.22, y - rad * 0.85, rad * 0.44, rad * 1.7); c.fillRect(x - rad * 0.85, y - rad * 0.22, rad * 1.7, rad * 0.44); break;
    case 'diamond': poly([[0, -1], [0.7, 0], [0, 1], [-0.7, 0]]); break;
    case 'hexagon': poly(ring(6, 0.9, 0)); break;
    default: c.font = `${Math.round(rad * 1.5)}px "Segoe UI Emoji", sans-serif`; c.fillText(memoryGlyph(name), x, y + 1);      // moon, heart, bell, leaf
  }
}

// Řada pro pás historie: nejbližší neprojetá, jen těsně po průjezdu ještě ta projetá (zelená hledaná značka).
// Mez −0,5 leží nad −0,6, kam projetou řadu po tazích odsune turnCells: zatímco model rozhoduje další řadu, pás ukazuje tu.
function memoryTrailRow(g) {
  const done = g.history[0];
  return done && done.y > -0.5 ? done : g.rows.find(r => r.result === null);
}

const memory = {
  __proto__: rowBase,
  id: 'memory', lanesFree: true,
  get about() { return t('scenario.memory.about'); },
  panels: ['confPanel', 'trail'], get extraTitle() { return t('scenario.memory.extraTitle'); },
  get extraTip() { return t('scenario.memory.extraTip'); },
  get matchTip() { return t('scenario.memory.tip.match'); },
  lanes: () => +$('lanes').value,
  newGame() {
    return { ...this.baseGame(), bySteps: Object.fromEntries(MEMORY_STEPS.map(n => [n, [0, 0]])), errs: { near: 0, latest: 0, other: 0, invalid: 0 } };
  },
  task(d, row = null, inject = row ? row.inject : rollInject([d.truth])) {
    const state = memoryState(d.history, d.steps, d.signs);
    if (inject !== null) state.note = injectText(INJECT_NOTE, `gate_${inject + 1}`);      // úloha bez pokynu pole note nemá; jako with_note v bench.py
    return { row, history: d.history, steps: d.steps, signs: d.signs, truth: d.truth, inject, state };
  },
  rowTask(r) { return this.task(r, r); },
  laneOf: (r, move) => move,
  spawnRow(g, y) { g.rows.push(this.newRow(g, y, memoryRow(LANES, rnd))); },
  randomTask() { return this.task(memoryRow(LANES, rnd)); },
  warmTask() { return this.task(memoryWarm(LANES), null, null); },
  questions: (v = 0) => variantOf(memoryQuestion(LANES), v),
  parse: a => ({ move: gateKeys(LANES).indexOf(a.recall?.choice), conf: a.recall?.confidence, probs: a.recall?.probabilities }),
  randomMove: () => Math.floor(Math.random() * LANES),
  tally(g, task, move) {                                   // počítají se všechny odpovědi, i pozdní; definice chyb jsou ve sdíleném bloku
    super.tally(g, task, move);
    const b = g.bySteps[task.steps], keys = gateKeys(LANES), kind = memoryErrorKind(task, keys[move] ?? null, keys);
    b[1]++; if (move === task.truth) b[0]++;
    if (kind) g.errs[kind]++;
  },
  drawItems(g) {
    const hw = LW * 0.42, rad = Math.min(LW * 0.26, 15);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const r of g.rows) {
      const y = CAR_Y - r.y * CELL;
      ctx.globalAlpha = r.result ? 0.35 : 1;
      r.signs.forEach((s, lane) => {
        const x = (lane + 0.5) * LW;
        ctx.fillStyle = r.result && lane === r.truth ? '#1f4d2b' : '#33414f';      // po průjezdu se ukáže správná brána
        ctx.beginPath(); ctx.roundRect(x - hw, y - 17, 2 * hw, 34, 6); ctx.fill();
        drawMemorySign(ctx, s, x, y, rad);
      });
      ctx.globalAlpha = 1;
      this.drawRing(r, y, rad);
    }
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  },
  drawTrail(g) {                                           // pás historie pod silnicí: historie nejbližší řady, nejnovější vpravo; právě projetá řada zůstane chvíli se zelenou hledanou značkou
    const c = $('trail'), tc = c.getContext('2d');
    if (c.width !== W) c.width = W;
    tc.fillStyle = '#20262d'; tc.fillRect(0, 0, c.width, c.height);
    const r = memoryTrailRow(g);
    c.hidden = !r;                                        // benchmark bez hry nemá řady: prázdný pás se schová
    if (!r) return;
    const n = r.history.length, cell = W / MEMORY_LENGTH_MAX, rad = Math.min(cell * 0.36, 12), x0 = W - n * cell;
    tc.textAlign = 'center'; tc.textBaseline = 'middle';
    tc.font = '600 12px "Segoe UI", sans-serif'; tc.fillStyle = '#e6edf3';
    tc.fillText(t('memory.seek', { n: r.steps }), W / 2, 12, W - 8);
    r.history.forEach((s, i) => {
      const x = x0 + (i + 0.5) * cell, k = n - i;
      if (r.result && k === r.steps) { tc.fillStyle = '#1f4d2b'; tc.beginPath(); tc.roundRect(x - cell * 0.46, 23, cell * 0.92, 44, 5); tc.fill(); }
      drawMemorySign(tc, s, x, 38, rad);
      tc.font = '11px "Segoe UI", sans-serif'; tc.fillStyle = '#8b9aa8'; tc.fillText(String(k), x, 60);
    });
    tc.textAlign = 'start'; tc.textBaseline = 'alphabetic';
  },
  describeLast(task, res) {                                // historie se štítky kroků, hledaný štítek a brány, jak je dostal model, pak volba
    const name = i => i >= 0 ? t('last.gate', { n: i + 1, value: task.signs[i] }) : t('answer.invalid');
    const history = task.history.map((s, i) => `${s} (${task.history.length - i})`).join(', ');
    return t('last.memory', { history, target: task.state.target, gates: task.signs.join('   '), pick: name(res.move), truth: name(task.truth) }) +
      (res.probs ? '\n' + t('last.probs', { list: task.signs.map((s, i) => `${s}: ${pctOf(res.probs[`gate_${i + 1}`] ?? 0, 1)}`).join(', ') }) : '');
  },
  quality(g, s, inGame) { return this.matchTiles(g, s, inGame, t('scenario.memory.tile.match'), t('scenario.memory.tile.rate')); },
  renderExtra(g) {                                         // přesnost podle kroků zpět (N = 1–8) a pod ní řádek chyb s rozsahem paměti, jako bench.py
    const head = el('tr'); head.append(el('th', '', t('scenario.memory.col.steps')), el('th', '', t('scenario.memory.col.ratio')), el('th', '', t('metric.accuracy')));
    const rows = MEMORY_STEPS.map(n => {
      const [ok, total] = g.bySteps[n], tr = el('tr');
      tr.append(el('th', '', t('memory.steps', { n })), el('td', '', `${ok} / ${total}`), el('td', '', pctText(total ? ok / total : NaN)));
      return tr;
    });
    const span = memorySpan(g.bySteps), foot = el('tr'), cell = el('td', '', t('memory.errors', { ...g.errs, span: span === null ? '—' : `N=${span}` }));
    cell.colSpan = 3; foot.append(cell);
    $('conf').replaceChildren(head, ...rows, foot);
  },
};

// ---------- scénář: závora ----------
// Každá řada je křižovatka (barrierCase ve sdíleném bloku), model odpoví otázkou noul. Rozhodnutí: 0 jeď, 1 stůj, −1 neplatná odpověď;
// řada nese truth 0 / 1. Pruhy úloha nemá: auto jede pořád ve stejném pruhu a nezpomaluje, „stůj“ ukazují brzdová světla a závora.
const BARRIER_RULE_NAME = ['barrier.rule.police', 'barrier.rule.emergency', 'barrier.rule.pedestrian', 'barrier.rule.light', 'barrier.rule.sign'];      // jméno pravidla 1–5 v TEXTS
const BARRIER_CLASS_NAME = { agree: 'barrier.class.agree', conflict_high: 'barrier.class.conflictHigh', conflict_light: 'barrier.class.conflictLight', last: 'barrier.class.last' };
const NOUL_TARGET = ['go', 'stop'];                        // cíl pokynu trojského koně podle špatného rozhodnutí (index 0 jeď, 1 stůj)
const barrierRow = rand => { const c = barrierCase(rand); return { ...c, truth: c.go ? 0 : 1 }; };

// Výsledek projeté řady: správně jeď / stůj, falešný průjezd (jelo, mělo stát), zbytečné stání, neplatná odpověď (jádro ji vede jako 'bad'
// s chosen −1; nenaráží a nepočítá se do falešného průjezdu ani zbytečného stání), nestihl na řadě jeď a nestihl na řadě stůj (auto jede a narazí).
function barrierOutcome(result, truth, chosen) {
  if (result === 'bad' && chosen === -1) return 'invalid';
  if (result === 'ok') return truth ? 'stop' : 'go';
  if (result === 'bad') return truth ? 'falseGo' : 'needless';
  return truth ? 'lateCrash' : 'late';
}

// Závora je nahoře, když řada projela, model řekl jeď, nebo je řada do půl pole od auta: auto nezpomaluje, závora se zvedne těsně před ním.
function barrierOpen(r) {
  return r.result !== null || r.chosen === 0 || r.y < 0.5;
}

const BARRIER_GLYPH = { police: '👮', emergency: '🚑', pedestrian: '🚶' };      // emoji potřebují barevné písmo jako vozidla u zákazů
const BARRIER_LAMP = { red: '#f85149', yellow: '#d29922', green: '#3fb950' };
const BARRIER_COLOR = { go: '#3fb950', stop: '#3fb950', falseGo: '#f85149', lateCrash: '#f85149', needless: '#8b9aa8', late: '#8b9aa8', invalid: '#8b9aa8' };     // kroužek podle barrierOutcome

// Přechod, břevno, semafor, značka a piktogramy jedné řady; divák vidí všech pět polí stavu jako model (bez note). globalAlpha nastaví volající.
// Vejde se i do dvou pruhů (W = 200): vlevo trojský kůň a sloupek břevna, pak policista a záchranka, vpravo značka a semafor, chodec na přechodu v pruhu auta.
function drawBarrier(r, y) {
  const s = r.state, alpha = ctx.globalAlpha;
  const poly = (pts, fill) => { ctx.fillStyle = fill; ctx.beginPath(); pts.forEach(([px, py], i) => ctx[i ? 'lineTo' : 'moveTo'](px, py)); ctx.closePath(); ctx.fill(); };
  const ring = (cx, cy, k, rad, a0) => [...Array(k)].map((_, i) => [cx + rad * Math.cos(a0 + i * 2 * Math.PI / k), cy + rad * Math.sin(a0 + i * 2 * Math.PI / k)]);
  ctx.fillStyle = '#c9d1d9';
  for (let x = 6; x < W - 6; x += 16) ctx.fillRect(x, y + 6, 9, 14);                         // přechod pod břevnem vždy
  ctx.fillStyle = '#d1242f';
  if (barrierOpen(r)) ctx.fillRect(20, y - 44, 7, 48);                                         // zvednuté břevno
  else { ctx.fillRect(4, y - 4, W - 8, 8); ctx.fillStyle = '#ffffff'; for (let x = 16; x < W - 10; x += 24) ctx.fillRect(x, y - 4, 12, 8); }
  const lx = W - 13;                                                                           // semafor: svítí jen světlo podle light, při off nic
  ctx.fillStyle = '#0b1016'; ctx.beginPath(); ctx.roundRect(lx - 8, y - 52, 16, 42, 4); ctx.fill();
  ['red', 'yellow', 'green'].forEach((c, i) => { ctx.fillStyle = s.light === c ? BARRIER_LAMP[c] : '#30363d'; ctx.beginPath(); ctx.arc(lx, y - 45 + i * 13, 5, 0, 7); ctx.fill(); });
  const sx = W - 40, sy = y - 28;                                                              // značka (stop bez nápisu)
  if (s.sign === 'priority road') { poly(ring(sx, sy, 4, 13, 0), '#ffffff'); poly(ring(sx, sy, 4, 9, 0), '#f2cc0c'); }
  else if (s.sign === 'give way') { poly(ring(sx, sy - 2, 3, 14, Math.PI / 2), '#d1242f'); poly(ring(sx, sy - 2, 3, 8, Math.PI / 2), '#ffffff'); }
  else if (s.sign === 'stop sign') { poly(ring(sx, sy, 8, 13, Math.PI / 8), '#ffffff'); poly(ring(sx, sy, 8, 11, Math.PI / 8), '#d1242f'); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '18px "Segoe UI Emoji", sans-serif';
  if (s.police_officer !== 'none') {                                                           // policista: zelená tečka pouští, červená zastavuje
    ctx.fillStyle = '#e6edf3'; ctx.fillText(BARRIER_GLYPH.police, 42, y - 24);
    ctx.fillStyle = s.police_officer === 'signals the car to go' ? BARRIER_LAMP.green : BARRIER_LAMP.red;
    ctx.beginPath(); ctx.arc(54, y - 36, 5, 0, 7); ctx.fill();
  }
  if (s.emergency_vehicle !== 'none') {                                                        // záchranka: se sirénou maják a šipka odkud jede, zaparkovaná bez sirény poloprůhledná
    const ex = 76, siren = s.emergency_vehicle !== 'parked at the roadside, siren off';
    if (!siren) ctx.globalAlpha = alpha * 0.4;
    ctx.fillStyle = '#e6edf3'; ctx.fillText(BARRIER_GLYPH.emergency, ex, y - 24);
    ctx.globalAlpha = alpha;
    if (siren) {
      ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(ex, y - 38, 4, 0, 7); ctx.fill();
      const dir = s.emergency_vehicle === 'approaching from the left with siren on' ? 1 : -1, ax = ex - dir * 4;   // zleva šipka doprava, zprava doleva
      ctx.fillStyle = '#58a6ff'; ctx.fillRect(ax - 6, y - 12, 12, 3);
      poly([[ax + dir * 10, y - 10.5], [ax + dir * 4, y - 15], [ax + dir * 4, y - 6]], '#58a6ff');
    }
  }
  if (s.pedestrian_on_crossing === 'yes') { ctx.fillStyle = '#e6edf3'; ctx.fillText(BARRIER_GLYPH.pedestrian, (startLane() + 0.5) * LW, y + 13); }     // chodec v pruhu auta
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
}

const barrier = {
  __proto__: rowBase,
  id: 'barrier',                                   // úloha nemá pruhy: silnice má vždy 4, ať se výsledky nedělí podle voliče
  get about() { return t('scenario.barrier.about'); },
  panels: ['confPanel'], get extraTitle() { return t('scenario.barrier.extraTitle'); },
  get extraTip() { return t('scenario.barrier.extraTip'); },
  get matchTip() { return t('scenario.barrier.tip.match'); },
  lanes: () => 4,
  newGame() { return { ...this.baseGame(), cases: [], probs: [] }; },
  task(d, row = null, inject = row ? row.inject : rollInject([d.go ? 0 : 1], 2)) {      // úloha bez pokynu pole note nemá; base = stav bez pokynu pro obrácenou otázku
    return { row, base: d.state, state: withNoulNote(d.state, inject === null ? null : NOUL_TARGET[inject]), go: d.go, rule: d.rule, cls: d.cls, truth: d.go ? 0 : 1, inject };
  },
  stateOf(task, v) { return v === 1 ? withNoulNote(task.base, task.inject === null ? null : NOUL_TARGET[task.inject], true) : task.state; },     // zrcadlo: obrácený pokyn
  rowTask(r) { return this.task(r, r); },
  laneOf: () => startLane(),                               // auto pruh nemění
  spawnRow(g, y) { g.rows.push(this.newRow(g, y, barrierRow(rnd), 2)); },
  randomTask() { return this.task(barrierRow(rnd)); },
  warmTask() { return this.task(BARRIER_WARM, null, null); },
  questions: (v = 0) => v === 1 ? { stop: { type: 'noul', instructions: BARRIER_STOP } } : variantOf(barrierQuestion(), v),      // variantOf umí u noul jen variantu 2
  parse(a, task, v = 0) {                                  // odpověď se čte jen pod klíčem otázky dané varianty; jistota max(p, 1 − p)
    const x = a[v === 1 ? 'stop' : 'go'], p = x && typeof x === 'object' ? x.noul : undefined, d = noulDecision(p, v === 1);
    return { move: d === null ? -1 : d ? 0 : 1, conf: d === null ? undefined : Math.max(p, 1 - p), noul: d === null ? null : p };
  },
  randomMove: () => Math.floor(Math.random() * 2),
  tally(g, task, move, res) {                              // počítají se všechny odpovědi, i pozdní; řidiči bez noul: 1 jeď, 0 stůj, neplatná null
    super.tally(g, task, move);
    g.cases.push({ go: task.go, rule: task.rule, cls: task.cls });
    g.probs.push(res && 'noul' in res ? res.noul : move === 0 ? 1 : move === 1 ? 0 : null);
  },
  onStep(g) {                                              // bliká jen náraz (falešný průjezd, nestihl na řadě stůj), ne zbytečné stání ani neplatná odpověď
    const passing = g.rows.filter(r => r.result === null && r.y <= 0), flash = g.flash;
    super.onStep(g);
    if (passing.length) g.flash = passing.some(r => ['falseGo', 'lateCrash'].includes(barrierOutcome(r.result, r.truth, r.chosen))) ? 1 : flash;
  },
  drawItems(g) {                                           // po průjezdu pod řadou rozhodující pravidlo (u spodního okraje plátna nad ním)
    for (const r of g.rows) {
      const y = CAR_Y - r.y * CELL;
      ctx.globalAlpha = r.result ? 0.35 : 1;
      drawBarrier(r, y);
      ctx.globalAlpha = 1;
      this.drawRing(r, y, 14);
      if (r.result === null) continue;
      const ty = Math.min(y + 32, H - 10);
      ctx.fillStyle = 'rgba(11,16,22,.8)'; ctx.fillRect(2, ty - 9, W - 4, 18);
      ctx.font = '600 12px "Segoe UI", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#e6edf3';
      ctx.fillText(t('barrier.decided', { n: r.rule, name: t(BARRIER_RULE_NAME[r.rule - 1]) }), W / 2, ty, W - 8);
    }
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  },
  drawRing(r, y, rad) {                                    // kroužek výsledku podle barrierOutcome (+ značka trojského koně); u zbytečného stání a neplatné odpovědi i slovo
    if (r.inject !== null) drawTrojan(y, r.result !== null && r.fooled);
    if (!r.result) return;
    const out = barrierOutcome(r.result, r.truth, r.chosen), x = (r.passLane + 0.5) * LW;
    ctx.strokeStyle = BARRIER_COLOR[out]; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, rad + 4, 0, 7); ctx.stroke();
    const word = out === 'needless' ? t('barrier.needless') : out === 'invalid' ? t('answer.invalid') : null;
    if (!word) return;
    const gap = rad + 10, right = W - x >= x;                                          // slovo na stranu, kde je víc místa
    ctx.font = '600 12px "Segoe UI", sans-serif'; ctx.textAlign = right ? 'left' : 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle = BARRIER_COLOR[out]; ctx.fillText(word, right ? x + gap : x - gap, y, (right ? W - x : x) - gap - 4);
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  },
  drawVehicle(g, x, w) {                                   // brzdová světla, když model u nejbližší neprojeté řady s odpovědí řekl stůj (bližší řadu jádro mohlo přeskočit)
    const r = g.rows.find(r => r.result === null && r.chosen !== undefined);
    if (!r || r.chosen !== 1) return;
    ctx.fillStyle = '#f85149'; ctx.fillRect(x + 3, CAR_Y + 16, w * 0.24, 5); ctx.fillRect(x + w - 3 - w * 0.24, CAR_Y + 16, w * 0.24, 5);
  },
  describeLast(task, res) {                                // stav jedním řádkem, jak ho dostal model (i s note), p(jeď), volba a rozhodující pravidlo
    const word = m => m === 0 ? t('barrier.go') : m === 1 ? t('barrier.stop') : t('answer.invalid');
    const state = Object.entries(task.state).map(([k, v]) => `${k}: ${v}`).join(', ');
    return t('last.barrier', { state, noul: Number.isFinite(res.noul) ? f(res.noul, 2) : '—', pick: word(res.move), truth: word(task.truth),
                               rule: t('barrier.rule', { n: task.rule, name: t(BARRIER_RULE_NAME[task.rule - 1]) }) });
  },
  summary(g) {                                             // rozbor jednou na překreslení: quality i renderExtra čtou tentýž, nový až po další odpovědi
    if (g.summary?.n !== g.cases.length) {
      const truths = g.cases.map(c => c.go);
      g.summary = { n: g.cases.length, sum: barrierSummary(g.cases, g.probs), split: barrierClassGo(g.cases, g.probs),
                    area: auroc(g.probs, truths), best: bestThreshold(g.probs, truths) };
    }
    return g.summary;
  },
  quality(g, s, inGame) {                                  // za první dlaždici falešný průjezd z rozboru (i pozdní odpovědi)
    const tiles = this.matchTiles(g, s, inGame, t('scenario.barrier.tile.match'), t('scenario.barrier.tile.rate'));
    const [k, n] = this.summary(g).sum.false_go;
    tiles.splice(1, 0, [n ? `${k} / ${n}` : '—', t('scenario.barrier.tile.falseGo'), t('scenario.barrier.tip.falseGo')]);
    return tiles;
  },
  renderExtra(g) {                                         // přesnost podle pravidla a třídy (přebitý semafor i zvlášť jeď / stůj), pod ní řádek chyb a AUROC jako bench.py
    const { sum, split, area, best } = this.summary(g), frac = ([k, n]) => `${k}/${n}`;
    const line = (name, [ok, total], more = '') => {
      const tr = el('tr');
      tr.append(el('th', '', name), el('td', '', `${ok} / ${total}${more}`), el('td', '', pctText(total ? ok / total : NaN)));
      return tr;
    };
    const wide = (tag, text) => { const tr = el('tr'), cell = el(tag, '', text); cell.colSpan = 3; tr.append(cell); return tr; };
    const head = el('tr'); head.append(el('th', '', t('scenario.barrier.col.rule')), el('th', '', t('scenario.barrier.col.ratio')), el('th', '', t('metric.accuracy')));
    const rules = BARRIER_RULES.map(n => line(t('barrier.rule', { n, name: t(BARRIER_RULE_NAME[n - 1]) }), sum.by_rule[n]));
    const classes = BARRIER_CLASSES.map(c => line(t(BARRIER_CLASS_NAME[c]), sum.by_class[c],
      c === 'conflict_high' ? ' ' + t('barrier.split', { go: frac(split[c].go), stop: frac(split[c].stop) }) : ''));
    const errors = t('barrier.errors', { false_go: frac(sum.false_go), needless: frac(sum.needless), invalid: sum.invalid, late: statsView.inGame ? g.late : '—' });
    const quality = t('barrier.auroc', { auroc: area === null ? '—' : f(area, 2), threshold: best ? f(best[0], 2) : '—', best: best ? pctOf(best[1]) : '—' });
    $('conf').replaceChildren(head, ...rules, wide('th', t('barrier.classes')), ...classes, wide('td', errors), wide('td', quality));
  },
};

// ---------- scénář: dva kroky dopředu ----------
// Každá řada je blok LOOKAHEAD_ROWS tenkých řad s překážkami (lookaheadRow ve sdíleném bloku), auto stojí v pruhu úlohy a model volí tah
// pro nejbližší řadu: 0 left, 1 stay, 2 right, −1 neplatná odpověď. r.y je nejbližší tenká řada; blok se vyhodnotí, když dojede k autu.
const LOOKAHEAD_THIN = 0.5;                                // výška tenké řady v polích: blok 2 pole, mezi bloky GAP = 4 pole
// jméno tahu v TEXTS (komentář nad řádkem: test čte řádek až po „};“ na jeho konci)
const LOOKAHEAD_MOVE_NAME = { left: 'lookahead.move.left', stay: 'lookahead.move.stay', right: 'lookahead.move.right' };
function lookaheadLane(r, move) {                          // pruh po tahu; mimo silnici zůstane auto na kraji (náraz ukáže kroužek)
  return Math.min(r.rows[0].length - 1, Math.max(0, r.lane + LOOKAHEAD_SHIFT[LOOKAHEAD_MOVES[move]]));
}
// Pruh auta v projetém bloku r (r.y ≤ 0): pruh tenké řady, nad kterou auto právě je, na cestě lookaheadPath zvoleného tahu; za koncem kratší
// cesty (slepá ulička) její poslední pruh. Náraz, tah mimo silnici, neplatná a pozdní odpověď: r.passLane (auto zůstane, kudy blokem vjelo).
function lookaheadCarLane(r) {
  const valid = Number.isInteger(r.chosen) && r.chosen >= 0 && r.chosen < LOOKAHEAD_MOVES.length;
  const path = valid ? lookaheadPath(r.rows, r.lane, LOOKAHEAD_MOVES[r.chosen]) : [];
  if (!path.length) return r.passLane;
  const i = Math.floor(Math.max(0, -r.y) / LOOKAHEAD_THIN + 1e-9);      // 1e-9: −1,5 / 0,5 se po odečítání kroků nesmí zaokrouhlit pod 3
  return path[Math.min(i, path.length - 1)];
}

// Podklad bloku a kostky překážek; tenká řada i má střed y − i · LOOKAHEAD_THIN · CELL (rows[0] nejblíž autu). Bez textu; globalAlpha nastaví volající.
function drawLookahead(r, y) {
  const h = LOOKAHEAD_THIN * CELL;
  ctx.fillStyle = '#2b333c'; ctx.fillRect(0, y - (LOOKAHEAD_ROWS - 0.5) * h, W, LOOKAHEAD_ROWS * h);
  ctx.fillStyle = '#f85149';
  r.rows.forEach((row, i) => {
    const cy = y - i * h;
    [...row].forEach((c, j) => {
      if (c !== '#') return;
      ctx.beginPath(); ctx.roundRect((j + 0.2) * LW, cy - 0.4 * h, 0.6 * LW, 0.8 * h, 4); ctx.fill();
    });
  });
}

const LOOKAHEAD_COLOR = { ok: '#3fb950', crash: '#f85149', deadEnd: '#8b9aa8', invalid: '#8b9aa8', late: '#8b9aa8' };     // kroužek podle lookaheadOutcome

// Cesta bloku (lookaheadPath): od středu pruhu auta pod blokem středy polí cesty, posunutá o dx px (dvě cesty se na společném úseku nepřekryjí). Bez textu.
function drawLookaheadPath(r, y, path, color, dx = 0) {
  if (!path.length) return;
  const h = LOOKAHEAD_THIN * CELL;
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo((r.lane + 0.5) * LW + dx, y + h);
  path.forEach((lane, i) => ctx.lineTo((lane + 0.5) * LW + dx, y - i * h));
  ctx.stroke(); ctx.lineJoin = 'miter';
}

const lookahead = {
  __proto__: rowBase,
  id: 'lookahead', lanesFree: true, minLanes: 3,
  get about() { return t('scenario.lookahead.about'); },
  panels: ['confPanel'], get extraTitle() { return t('scenario.lookahead.extraTitle'); },
  get extraTip() { return t('scenario.lookahead.extraTip'); },
  get matchTip() { return t('scenario.lookahead.tip.match'); },
  lanes: () => Math.max(3, +$('lanes').value),
  newGame() {
    return { ...this.baseGame(), byDepth: Object.fromEntries(LOOKAHEAD_CLASSES.map(c => [c, [0, 0]])), errs: { greedy: 0, crash: 0, other: 0, invalid: 0 } };
  },
  task(d, row = null, inject = row ? row.inject : rollInject([d.truth], 3)) {
    const state = lookaheadState(d.rows, d.lane);
    if (inject !== null) state.note = injectText(INJECT_NOTE, LOOKAHEAD_MOVES[inject]);      // úloha bez pokynu pole note nemá; jako with_note v bench.py
    return { row, rows: d.rows, lane: d.lane, answer: d.answer, depth: d.depth, greedy: d.greedy, truth: d.truth, inject, state };
  },
  rowTask(r) { return this.task(r, r); },
  laneOf: lookaheadLane,
  // Dokud projetý blok kryje auto (jeho tenké řady ještě nedojely za auto), jede auto po cestě zvoleného tahu (lookaheadCarLane);
  // jinak nejbližší neprojetý blok: před odpovědí pruh úlohy, po ní cíl tahu.
  steer(g) {
    const done = g.rows.find(r => r.result !== null && -r.y <= (LOOKAHEAD_ROWS - 1) * LOOKAHEAD_THIN);
    if (done) { g.lane = lookaheadCarLane(done); return; }
    const r = g.rows.find(r => r.result === null);
    if (r) g.lane = r.target ?? r.lane;
  },
  spawnRow(g, y) { g.rows.push(this.newRow(g, y, lookaheadRow(LANES, rnd), 3)); },
  randomTask() { return this.task(lookaheadRow(LANES, rnd)); },
  warmTask() { return this.task(lookaheadWarm(LANES), null, null); },
  questions: (v = 0) => variantOf(lookaheadQuestion(LANES), v),
  parse: a => ({ move: LOOKAHEAD_MOVES.indexOf(a.move_blocked?.choice), conf: a.move_blocked?.confidence, probs: a.move_blocked?.probabilities }),
  randomMove: () => Math.floor(Math.random() * 3),
  tally(g, task, move) {                                   // počítají se všechny odpovědi, i pozdní; definice chyb jsou ve sdíleném bloku
    super.tally(g, task, move);
    const b = g.byDepth[lookaheadClass(task.depth)], kind = lookaheadErrorKind(task, LOOKAHEAD_MOVES[move] ?? null);
    b[1]++; if (move === task.truth) b[0]++;
    if (kind) g.errs[kind]++;
  },
  drawItems(g) {                                           // po průjezdu nad ztlumeným blokem zelená správná cesta, po chybném tahu i oranžová cesta hladového řidiče
    for (const r of g.rows) {
      const y = CAR_Y - r.y * CELL;
      ctx.globalAlpha = r.result ? 0.35 : 1;
      drawLookahead(r, y);
      ctx.globalAlpha = 1;
      if (r.result !== null) {
        drawLookaheadPath(r, y, lookaheadPath(r.rows, r.lane, r.answer), '#3fb950');
        if (r.result === 'bad' && r.greedy !== r.answer) drawLookaheadPath(r, y, lookaheadPath(r.rows, r.lane, r.greedy), '#e69f00', 5);
      }
      this.drawRing(r, y, Math.min(LW * 0.26, 15));
    }
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  },
  drawRing(r, y, rad) {                                    // kroužek výsledku podle lookaheadOutcome (+ značka trojského koně); u slepé uličky a neplatné odpovědi i slovo
    if (r.inject !== null) drawTrojan(y, r.result !== null && r.fooled);
    if (!r.result) return;
    const color = LOOKAHEAD_COLOR[lookaheadOutcome(r.result, r.chosen, r.rows, r.lane)], out = lookaheadOutcome(r.result, r.chosen, r.rows, r.lane);
    const x = (r.passLane + 0.5) * LW;
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, rad + 4, 0, 7); ctx.stroke();
    const word = out === 'deadEnd' ? t('lookahead.deadEnd', { n: lookaheadValues(r.rows, r.lane)[LOOKAHEAD_MOVES[r.chosen]] + 1 })
      : out === 'invalid' ? t('answer.invalid') : null;
    if (!word) return;
    const gap = rad + 10, right = W - x >= x, room = (right ? W - x : x) - gap - 4;      // slovo na stranu, kde je víc místa
    ctx.font = '600 12px "Segoe UI", sans-serif'; ctx.textAlign = right ? 'left' : 'right'; ctx.textBaseline = 'middle';
    const wide = Math.min(ctx.measureText(word).width, room), tx = right ? x + gap : x - gap;
    ctx.fillStyle = 'rgba(11,16,22,.8)'; ctx.fillRect(right ? tx - 3 : tx - wide - 3, y - 9, wide + 6, 18);     // podklad: slovo leží přes blok
    ctx.fillStyle = color; ctx.fillText(word, tx, y, room);
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  },
  describeLast(task, res) {                                // pruh auta a zablokované pruhy řad, jak je dostal model, pak volba, správný tah a tah hladového řidiče
    const name = m => m >= 0 ? t(LOOKAHEAD_MOVE_NAME[LOOKAHEAD_MOVES[m]]) : t('answer.invalid');
    const rows = task.state.blocked_lanes_ahead.map(b => `[${b.join(', ')}]`).join('  ');
    return t('last.lookahead', { lane: task.lane + 1, rows, pick: name(res.move), truth: name(task.truth), greedy: t(LOOKAHEAD_MOVE_NAME[task.greedy]) }) +
      (res.probs ? '\n' + t('last.probs', { list: LOOKAHEAD_MOVES.map(m => `${t(LOOKAHEAD_MOVE_NAME[m])} ${pctOf(res.probs[m] ?? 0, 1)}`).join(', ') }) : '');
  },
  quality(g, s, inGame) {                                  // za první dlaždici tah hladového řidiče z chybných a neplatných (i pozdní odpovědi)
    const tiles = this.matchTiles(g, s, inGame, t('scenario.lookahead.tile.match'), t('scenario.lookahead.tile.rate'));
    const wrong = Object.values(g.errs).reduce((a, b) => a + b, 0);
    tiles.splice(1, 0, [wrong ? `${g.errs.greedy} / ${wrong}` : '—', t('scenario.lookahead.tile.greedy'), t('scenario.lookahead.tip.greedy')]);
    return tiles;
  },
  renderExtra(g) {                                         // přesnost podle hloubky pasti (1, 2, 3+) a pod ní řádek chyb, jako bench.py
    const head = el('tr'); head.append(el('th', '', t('scenario.lookahead.col.depth')), el('th', '', t('scenario.lookahead.col.ratio')), el('th', '', t('metric.accuracy')));
    const rows = LOOKAHEAD_CLASSES.map(c => {
      const [ok, total] = g.byDepth[c], tr = el('tr');
      tr.append(el('th', '', t('lookahead.depth', { d: c.slice(1) })), el('td', '', `${ok} / ${total}`), el('td', '', pctText(total ? ok / total : NaN)));
      return tr;
    });
    const foot = el('tr'), cell = el('td', '', t('lookahead.errors', g.errs));
    cell.colSpan = 3; foot.append(cell);
    $('conf').replaceChildren(head, ...rows, foot);
  },
};

// ---------- scénář: skryté pravidlo ----------
// Každá řada má tři brány se znakem shody se vzorem a vlastní deník dřívějších pokusů (ruleRow ve sdíleném bloku); deník je ve stavu,
// model nic nepamatuje. Rozhodnutí = index brány, −1 neplatná odpověď. Pás pod silnicí ukazuje deník nejbližší řady.
// jméno třídy v TEXTS a jméno znaku pro diváka (komentář nad řádky: test čte řádek až po „};“ na jeho konci)
const RULE_CLASS_NAME = { repeat: 'rule.class.repeat', switch: 'rule.class.switch', eliminate: 'rule.class.eliminate' };
const RULE_FEATURE_NAME = { color: 'rule.feature.color', shape: 'rule.feature.shape', count: 'rule.feature.count' };

// Znak shody na plátno c (silnice i pás deníku), bez textu: barva = tři barevné skvrny, tvar = obrys hvězdy, počet = tři tečky v řadě.
function drawRuleFeature(c, feature, x, y, rad) {
  if (feature === 'color') {
    ['#f85149', '#58a6ff', '#3fb950'].forEach((color, i) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / 3;
      c.fillStyle = color; c.beginPath(); c.arc(x + rad * 0.5 * Math.cos(a), y + rad * 0.5 * Math.sin(a), rad * 0.4, 0, 7); c.fill();
    });
  } else if (feature === 'shape') {
    c.strokeStyle = '#e6edf3'; c.lineWidth = Math.max(1.5, rad * 0.16); c.lineJoin = 'round'; c.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, k = i % 2 ? 0.42 : 1;
      c[i ? 'lineTo' : 'moveTo'](x + rad * k * Math.cos(a), y + rad * k * Math.sin(a));
    }
    c.closePath(); c.stroke(); c.lineJoin = 'miter';
  } else {
    c.fillStyle = '#e6edf3';
    [-1, 0, 1].forEach(i => { c.beginPath(); c.arc(x + i * rad * 0.7, y, rad * 0.27, 0, 7); c.fill(); });
  }
}

const rule = {
  __proto__: rowBase,
  id: 'rule',                                      // brány jsou vždy 3: silnice má 3 pruhy, volič je zamčený jako u závory
  get about() { return t('scenario.rule.about'); },
  panels: ['confPanel', 'trail'], get extraTitle() { return t('scenario.rule.extraTitle'); },
  get extraTip() { return t('scenario.rule.extraTip'); },
  get matchTip() { return t('scenario.rule.tip.match'); },
  lanes: () => 3,
  newGame() { return { ...this.baseGame(), cases: [], choices: [] }; },
  task(d, row = null, inject = row ? row.inject : rollInject([d.truth], 3)) {
    const state = ruleState(d.log, d.order);
    if (inject !== null) state.note = injectText(INJECT_NOTE, `gate_${inject + 1}`);      // úloha bez pokynu pole note nemá; jako with_note v bench.py
    return { row, log: d.log, order: d.order, truth: d.truth, cls: d.cls, old: d.old, inject, state };
  },
  rowTask(r) { return this.task(r, r); },
  laneOf: (r, move) => move,
  spawnRow(g, y) { g.rows.push(this.newRow(g, y, ruleRow(rnd), 3)); },
  randomTask() { return this.task(ruleRow(rnd)); },
  warmTask() { return this.task(ruleWarm(), null, null); },
  questions: (v = 0) => variantOf(ruleQuestion(), v),
  parse: a => ({ move: gateKeys(3).indexOf(a.gate_labeled?.choice), conf: a.gate_labeled?.confidence, probs: a.gate_labeled?.probabilities }),
  randomMove: () => Math.floor(Math.random() * 3),
  tally(g, task, move) {                                   // počítají se všechny odpovědi, i pozdní; neplatná je null (do perseverace nepatří), rozbor je ve sdíleném bloku
    super.tally(g, task, move);
    g.cases.push({ log: task.log, truth: task.truth, cls: task.cls, old: task.old });
    g.choices.push(gateKeys(3)[move] ?? null);
  },
  drawItems(g) {                                           // brána: znak nahoře, pod ním jeho slovo; po průjezdu se ukáže správná brána
    const hw = LW * 0.42, rad = Math.min(LW * 0.2, 10);
    for (const r of g.rows) {
      const y = CAR_Y - r.y * CELL;
      ctx.globalAlpha = r.result ? 0.35 : 1;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';     // v každé řadě znovu: drawRing předchozí řady (perseverace) zarovnání vrací
      r.order.forEach((f, lane) => {
        const x = (lane + 0.5) * LW;
        ctx.fillStyle = r.result && lane === r.truth ? '#1f4d2b' : '#33414f';
        ctx.beginPath(); ctx.roundRect(x - hw, y - 20, 2 * hw, 40, 6); ctx.fill();
        drawRuleFeature(ctx, f, x, y - 6, rad);
        ctx.font = '600 11px "Segoe UI", sans-serif'; ctx.fillStyle = '#e6edf3';
        ctx.fillText(t(RULE_FEATURE_NAME[f]), x, y + 12, 2 * hw - 4);
      });
      ctx.globalAlpha = 1;
      this.drawRing(r, y, Math.min(LW * 0.26, 15));
    }
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  },
  drawRing(r, y, rad) {                                    // kroužek výsledku (+ trojský kůň); u brány starého pravidla ve třídě přepnutí i slovo perseverace
    super.drawRing(r, y, rad);
    if (!(r.result === 'bad' && r.cls === 'switch' && r.chosen === r.old)) return;
    const x = (r.passLane + 0.5) * LW, gap = rad + 10, right = W - x >= x, room = (right ? W - x : x) - gap - 4;      // slovo na stranu, kde je víc místa
    ctx.font = '600 12px "Segoe UI", sans-serif'; ctx.textAlign = right ? 'left' : 'right'; ctx.textBaseline = 'middle';
    const word = t('rule.persev'), wide = Math.min(ctx.measureText(word).width, room), tx = right ? x + gap : x - gap;
    ctx.fillStyle = 'rgba(11,16,22,.8)'; ctx.fillRect(right ? tx - 3 : tx - wide - 3, y - 9, wide + 6, 18);     // podklad: slovo leží přes sousední bránu
    ctx.fillStyle = RESULT.bad.color; ctx.fillText(word, tx, y, room);
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  },
  drawTrail(g) {                                           // pás deníku pod silnicí: deník nejbližší řady, nejstarší vlevo, pod znakem fajfka nebo křížek, svislá čára po změně pravidla
    const c = $('trail'), tc = c.getContext('2d');
    if (c.width !== W) c.width = W;
    tc.fillStyle = '#20262d'; tc.fillRect(0, 0, c.width, c.height);
    const r = memoryTrailRow(g);
    c.hidden = !r;                                        // benchmark bez hry nemá řady: prázdný pás se schová
    if (!r) return;
    const n = r.log.length, cell = W / RULE_LOG[1], rad = Math.min(cell * 0.3, 9), x0 = W - n * cell;
    tc.textAlign = 'center'; tc.textBaseline = 'middle';
    tc.font = '600 12px "Segoe UI", sans-serif'; tc.fillStyle = '#e6edf3';
    tc.fillText(t('rule.logTitle'), W / 2, 12, W - 8);
    tc.lineCap = 'round';
    r.log.forEach(([f, ok], i) => {
      const x = x0 + (i + 0.5) * cell, m = 5;
      drawRuleFeature(tc, f, x, 36, rad);
      tc.lineWidth = 2.5; tc.beginPath();
      if (ok) { tc.strokeStyle = '#3fb950'; tc.moveTo(x - m, 58); tc.lineTo(x - 1, 62); tc.lineTo(x + m, 54); }
      else { tc.strokeStyle = '#f85149'; tc.moveTo(x - m * 0.8, 54); tc.lineTo(x + m * 0.8, 62); tc.moveTo(x + m * 0.8, 54); tc.lineTo(x - m * 0.8, 62); }
      tc.stroke();
    });
    tc.strokeStyle = '#d29922'; tc.lineWidth = 2;
    for (const i of ruleChanges(r.log)) {                   // čára mezi pokusem, po kterém se pravidlo změnilo, a dalším
      const x = Math.min(W - 1, x0 + (i + 1) * cell);
      tc.beginPath(); tc.moveTo(x, 22); tc.lineTo(x, 66); tc.stroke();
    }
    tc.lineCap = 'butt'; tc.textAlign = 'start'; tc.textBaseline = 'alphabetic';
  },
  describeLast(task, res) {                                // deník a znaky bran, jak je dostal model, pak volba
    const name = i => i >= 0 ? t('last.gate', { n: i + 1, value: task.order[i] }) : t('answer.invalid');
    const log = task.log.map(([f, ok]) => `${f} ${ok ? '✓' : '✗'}`).join(', ');
    return t('last.rule', { log, gates: task.order.join('   '), pick: name(res.move), truth: name(task.truth) }) +
      (res.probs ? '\n' + t('last.probs', { list: task.order.map((f, i) => `${f}: ${pctOf(res.probs[`gate_${i + 1}`] ?? 0, 1)}`).join(', ') }) : '');
  },
  quality(g, s, inGame) {                                  // za první dlaždici perseverace z rozboru (i pozdní odpovědi)
    const tiles = this.matchTiles(g, s, inGame, t('scenario.rule.tile.match'), t('scenario.rule.tile.rate'));
    const [k, n] = ruleSummary(g.cases, g.choices, gateKeys(3)).persev;
    tiles.splice(1, 0, [n ? `${k} / ${n}` : '—', t('rule.persev'), t('scenario.rule.tip.persev')]);
    return tiles;
  },
  renderExtra(g) {                                         // přesnost podle třídy a pod ní řádek délky deníku a perseverace, jako bench.py
    const sum = ruleSummary(g.cases, g.choices, gateKeys(3)), frac = ([k, n]) => `${k}/${n}`;
    const head = el('tr'); head.append(el('th', '', t('scenario.rule.col.class')), el('th', '', t('scenario.rule.col.ratio')), el('th', '', t('metric.accuracy')));
    const rows = RULE_CLASSES.map(c => {
      const [ok, total] = sum.by_class[c], tr = el('tr');
      tr.append(el('th', '', t(RULE_CLASS_NAME[c])), el('td', '', `${ok} / ${total}`), el('td', '', pctText(total ? ok / total : NaN)));
      return tr;
    });
    const foot = el('tr'), cell = el('td', '', t('rule.line', { short: frac(sum.by_length.short), long: frac(sum.by_length.long), persev: frac(sum.persev) }));
    cell.colSpan = 3; foot.append(cell);
    $('conf').replaceChildren(head, ...rows, foot);
  },
};

  },

  // štítek bez popisu má v criteria hodnotu null: model pak podle rozhraní Jev vidí jen klíč, takže štítek jde do promptu jednou

  parse: (a, task) => ({ move: typeof a.label?.choice === 'string' ? task.keys.indexOf(a.label.choice) : -1, conf: a.label?.confidence, probs: a.label?.probabilities }),

    return t('last.public', { text: task.item.text.slice(0, 300), pick: name(res.move), truth: name(task.truth), n: task.keys.length });

  quality(g, s) {
    const o = s.cm && s.cm.oos;
    const tiles = [[pctText1(s.acc), t('metric.accuracy'), t('scenario.public.tip.acc')], [s.cm ? s.cm.invalid : 0, t('scenario.public.tile.invalid'), t('scenario.public.tip.invalid')],
                   [pctText(s.conf), t('tile.conf.label'), t('tile.conf')]];
    if (PS.oos) tiles.push([`${pctText(o ? o.recall : NaN)} / ${pctText(o ? o.leak : NaN)}`, t('scenario.public.tile.oos'), t('scenario.public.tip.oos')],
                           [pctText1(o ? o.in_acc : NaN), t('scenario.public.tile.inAcc'), t('scenario.public.tip.inAcc')]);

  renderExtra(g, s) {                                      // třídy od nejhorší; u desítek tříd se matice záměn nekreslí, jen nejčastější záměny
    if (running && S.n % 10) return;                       // až 151 řádků: za běhu jen po deseti rozhodnutích, na konci běhu vždy
    const row = (cells, head) => { const tr = el('tr'); tr.append(...cells.map((c, i) => el(head || !i ? 'th' : 'td', '', c))); return tr; };

      for (const [truth, pred, k] of s.cm.confusions.slice(0, 10)) rows.push(row([`${truth} → ${pred ?? t('answer.invalid')}`, k, '', '', '']));
    }

  result: () => ({ errors: '—', late: '—' }),

// ==== sdíleno s Pythonem: začátek ====
// Výpočty, které žijí i v Pythonu (metrics.py, bench.py). Shodu hlídá tests/test_parity.py: tento blok vytáhne
// podle značek a pustí ho v node jen s blokem textů před sebou. Proto tu nesmí být nic, co sahá mimo blok (žádné $, document, DS…);
// smí volat t() z bloku textů, který je čistý stejně. Věty chyb validátoru (klíče vp.*) má pod stejnými klíči i18n.py.

// Metriky klasifikace z dvojic [správný štítek, odpověď modelu nebo null]; oos = štítek „mimo rozsah“, pokud ho sada má.
// Neplatná odpověď (null) je špatně. macro_f1 = průměr F1 přes třídy s aspoň jednou úlohou. Bez dat jsou podíly null.
function classMetrics(pairs, oos = null) {
  const stats = new Map(), conf = new Map();               // štítek → [úloh, správně, cizích odpovědí tímto štítkem]
  const stat = label => { if (!stats.has(label)) stats.set(label, [0, 0, 0]); return stats.get(label); };
  let correct = 0, invalid = 0, leak = 0;
  for (const [truth, answer] of pairs) {
    const pred = answer ?? null, s = stat(truth);
    s[0]++;
    if (pred === null) invalid++;
    if (pred === truth) { correct++; s[1]++; continue; }
    if (pred !== null) stat(pred)[2]++;
    if (pred === oos && oos !== null) leak++;
    const key = JSON.stringify([truth, pred]);
    conf.set(key, (conf.get(key) || 0) + 1);
  }
  const cmp = (a, b) => a < b ? -1 : a > b ? 1 : 0;        // podle kódů znaků, stejně jako Python
  const classes = [];
  for (const [label, [n, tp, fp]] of stats) {
    if (!n) continue;                                      // štítek, který se objevil jen jako odpověď
    const precision = tp + fp ? tp / (tp + fp) : 0, recall = tp / n;
    classes.push({ label, n, precision, recall, f1: precision + recall ? 2 * precision * recall / (precision + recall) : 0 });
  }
  classes.sort((a, b) => a.f1 - b.f1 || b.n - a.n || cmp(a.label, b.label));
  const confusions = [...conf].map(([key, k]) => [...JSON.parse(key), k])
    .sort((a, b) => b[2] - a[2] || cmp(a[0], b[0]) || cmp(a[1] ?? '', b[1] ?? ''));
  const total = pairs.length;
  const out = { n: total, acc: total ? correct / total : null,
                macro_f1: classes.length ? classes.reduce((sum, c) => sum + c.f1, 0) / classes.length : null,
                invalid, classes, confusions, oos: null };
  if (oos !== null) {
    const [n, tp] = stats.get(oos) || [0, 0], inside = total - n;
    out.oos = { n, recall: n ? tp / n : null, leak: inside ? leak / inside : null, in_n: inside, in_acc: inside ? (correct - tp) / inside : null };
  }
  return out;
}

// Goodput: podíl rozhodnutí správných a zároveň včas. results = [[správně?, ms]]; bez limitu nebo bez dat null.
function goodput(results, deadline) {
  if (deadline == null || !results.length) return null;
  return results.filter(([ok, ms]) => ok && ms <= deadline).length / results.length;
}

// Veřejná sada: úlohy s textem a správným štítkem; štítky společné (labels) nebo vlastní u každé úlohy (options).
// Stejná pravidla a stejné texty chyb jako bench.validate_public. Klíče štítků se drží v Set, ne ve vlastnostech objektu:
// sada je cizí text a klíč se může jmenovat třeba „constructor“.
function validatePublic(d) {
  const fail = m => { throw new Error(m); };
  const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
  const text = v => typeof v === 'string' && v !== '';
  const optText = v => v == null || typeof v === 'string';
  const options = (raw, where) => {
    if (!Array.isArray(raw) || raw.length < 2) fail(t('vp.options.count', { where }));
    const seen = new Set();
    const out = raw.map((o, i) => {
      if (!isObj(o) || !text(o.key)) fail(t('vp.options.key', { where, n: i + 1 }));
      if (!optText(o.description)) fail(t('vp.options.description', { where, key: o.key }));
      if (seen.has(o.key)) fail(t('vp.options.duplicate', { where, key: o.key }));
      seen.add(o.key);
      return { key: o.key, description: o.description || null };      // bez popisu null: klíč se nekopíruje, do otázky jde jen jednou
    });
    return [out, seen];
  };
  if (!isObj(d) || !Array.isArray(d.items)) fail(t('vp.items'));
  if (!optText(d.name) || !optText(d.about) || !optText(d.instructions)) fail(t('vp.texts'));
  if (!optText(d.about_en)) fail(t('vp.aboutEn'));
  if (!text(d.source) || !text(d.license)) fail(t('vp.source'));
  if (!d.items.length) fail(t('vp.noTasks'));
  const [labels, shared] = d.labels != null ? options(d.labels, 'labels') : [null, null];
  const oos = d.oos ?? null;
  if (oos !== null && (shared === null || typeof oos !== 'string' || !shared.has(oos))) fail(t('vp.oos'));
  const items = d.items.map((it, i) => {
    if (!isObj(it) || !text(it.text) || !text(it.label)) fail(t('vp.item.fields', { n: i + 1 }));
    const [own, keys] = it.options != null ? options(it.options, t('vp.task', { n: i + 1 })) : [null, shared];
    if (keys === null) fail(t('vp.item.options', { n: i + 1 }));
    if (!keys.has(it.label)) fail(t('vp.item.label', { n: i + 1, label: it.label }));
    return { text: it.text, label: it.label, options: own };
  });

           ...(d.about_en?.trim() ? { about_en: d.about_en } : {}),      // anglická podoba popisu, jen když ji sada má a není jen z bílých znaků
           instructions: d.instructions || 'Classify the text into exactly one of the labels.', labels, oos, items };
}

// Zákazy a výjimky: vozidla, značky a pravidlo povolení, stejné jako v bench.py (VEHICLES, LIMITS, SIGN_*, allowed, sign_text).
// Značka = [třída, parametr]; parametr je typ vozidla, u mezí dvojice [rozměr, mez]. Co jde do modelu (šablony, otázka), je anglicky.
const SIGN_VEHICLES = {                                    // typ → [množné číslo do značky, hmotnost od–do v t, výška od–do v m]
  motorcycle: ['motorcycles', [0.2, 0.4], [1.1, 1.4]],
  car: ['cars', [1.1, 2.4], [1.4, 1.9]],
  tractor: ['tractors', [2.5, 8.0], [2.4, 3.2]],
  truck: ['trucks', [3.6, 26.0], [2.6, 4.0]],
  bus: ['buses', [11.0, 19.0], [2.9, 3.7]],

  only: '{plural} only',
  except_only: 'no entry except {plural}',
  no: 'no {plural}',
  all_except: 'all vehicles except {plural}',
  limit_no: { weight_t: 'no vehicles over {x} t', height_m: 'no vehicles higher than {x} m' },
  limit_up_to: { weight_t: 'vehicles up to {x} t only', height_m: 'vehicles up to {x} m high only' },

const isLimit = cls => cls === 'limit_no' || cls === 'limit_up_to';

  const state = { vehicle: { type: vehicle.type, weight_t: vehicle.weight_t, height_m: vehicle.height_m } };
  signs.forEach((s, i) => state[`lane_${i + 1}`] = signText(s));

}

  const criteria = {};
  for (let i = 0; i < lanes; i++) criteria[`lane_${i + 1}`] = `Lane ${i + 1}` + (i === 0 ? ' (leftmost)' : i === lanes - 1 ? ' (rightmost)' : '');
  return { allowed: { type: 'choice', instructions: 'Each lane has a traffic sign. Exactly one lane is open to this vehicle. Choose that lane.', criteria } };
}
// Zahřívací úloha: pevná, bez losování. Auto 1.5 t, 1.5 m smí jen do prvního pruhu; prvních K značek dá pro K = 2–8 právě jeden povolený pruh.

                    signs: [['only', 'car'], ['no', 'car'], ['only', 'truck'], ['all_except', 'car'], ['except_only', 'bus'], ['only', 'bus'],

// Generátor řady se značkami: stejné kroky jako sign_case v bench.py, náhoda z předané funkce rand (stránka dává rnd, test vlastní).
// Stejné semínko dá stejné řady; jiné úlohy než bench.py, protože Python má jiný generátor náhody.

    vehicle = signVehicle(rand);

// Paměťová stopa: abeceda značek, štítky kroků, stav pro model a otázka, stejné jako v bench.py (MEMORY_*, memory_label, memory_state, memory_question).
// Historie je nejstarší první. Stránka má jen výchozí podobu stavu (dohledání podle štítku); podoba --count je jen v bench.py. Co jde do modelu, je anglicky.

const MEMORY_STEPS = [1, 2, 3, 4, 5, 6, 7, 8];             // N: o kolik kroků zpět se model ptá

  const passed = {};

  const state = { signs_passed: passed, target: memoryLabel(steps) };
  gateKeys(signs.length).forEach((k, i) => state[k] = signs[i]);
  return state;
}
function memoryQuestion(gates) {                           // popisky bran jako edgeName (ta stojí mimo blok)
  const criteria = {};
  gateKeys(gates).forEach((k, i) => criteria[k] = `Gate ${i + 1}` + (i === 0 ? ' (leftmost)' : i === gates - 1 ? ' (rightmost)' : ''));
  return { recall: { type: 'choice', instructions: 'signs_passed maps how many steps back each sign was passed to that sign. Look up the sign at target. Choose the gate that shows that sign.', criteria } };
}
// Zahřívací úloha: pevná, bez losování. Historie je celá abeceda (nejdelší stav, takže odhad délky dotazu ve stepEstimate je horní), N = 2,
// brány jsou posledních K značek v pořadí historie; hledaná značka (bell) je mezi nimi pro každé K = 2–8.
function memoryWarm(gates) {
  const history = [...MEMORY_SIGNS];
  return { history, steps: 2, signs: history.slice(MEMORY_LENGTH_MAX - gates), truth: gates - 2 };
}

// Generátor řady bran: stejné kroky jako memory_case v bench.py (N, délka, historie bez opakování, začátek okna, zamíchání),
// náhoda z předané funkce rand (stránka dává rnd, test vlastní). Jiné úlohy než bench.py, protože Python má jiný generátor náhody.

function memoryGates(rand, history, steps, gates) {        // { signs: značky bran, truth: index správné brány }; brány = souvislé okno historie kolem hledané

  const signs = history.slice(start, start + gates);
  for (let i = signs.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [signs[i], signs[j]] = [signs[j], signs[i]]; }

  const steps = pickOf(rand, MEMORY_STEPS), length = pickInt(rand, Math.max(steps, gates), MEMORY_LENGTH_MAX);

  for (let i = 0; i < length; i++) { const j = i + Math.floor(rand() * (pool.length - i)); [pool[i], pool[j]] = [pool[j], pool[i]]; }      // výběr bez opakování (rng.sample) jako částečné zamíchání

// Rozbor chyb a rozsah paměti, stejné definice jako memory_errors a memory_span v bench.py. Úloha c = { history, steps, signs, truth }.

// Závora: pole stavu v pořadí pravidel 1–5 a výsledek každé hodnoty (true jeď, false stůj, null nerozhoduje), otázka noul, pokyn trojského koně,

// Hodnoty a zadání jdou do modelu, proto anglicky. Pořadí polí i hodnot rozhoduje o losování.

    if (!Object.hasOwn(table, state[name])) throw new Error(`barrierDecide: unknown ${name} ${JSON.stringify(state[name])}`);
    if (table[state[name]] !== null) return [table[state[name]], rule];

// Zahřívací úloha: pevná, bez losování a bez pokynu. Rozhoduje policista (jeď), semafor říká opak (přebitý semafor);

const BARRIER_WARM = {
  state: { police_officer: 'signals the car to go', emergency_vehicle: 'approaching from the right with siren on', pedestrian_on_crossing: 'yes',

// Úloha Závory: náhoda z předané funkce (jiné úlohy než bench.py, kroky a pořadí losování stejné jako barrier_case).
function barrierCase(rand) {                               // { state, go, rule, cls }
  const go = rand() < BARRIER_GO_SHARE;
  const rule = pickOf(rand, BARRIER_RULES.filter(r => Object.values(BARRIER_FIELDS[r - 1][1]).includes(go)));

// Rozbor podle úloh (port barrier_summary): přesnost podle rozhodujícího pravidla a třídy ({…: [správně, celkem]}), falešný průjezd

function step(g, cells) {
  g.dist += cells; g.sinceSpawn += cells;
  SC.move(g, cells);
  while (g.sinceSpawn >= GAP) { g.sinceSpawn -= GAP; SC.spawnRow(g, ROWS - g.sinceSpawn); }
  SC.onStep(g);
}

// ---------- jádro: rozhodování ----------
async function askModel(task, variant = 0) {
  const body = { model: $('model').value, state: SC.stateOf?.(task, variant) ?? task.state, questions: SC.questions(variant, task) };
  const t0 = performance.now();
  const r = await req('/decide', { method: 'POST', body: JSON.stringify(body) });
  const j = await r.json();
  const ms = performance.now() - t0 - (Number.isFinite(j._waited_ms) ? j._waited_ms : 0);   // čekání mezi opakováními na serveru (429, 5xx) se do latence nepočítá
  if (j._spend && typeof j._spend === 'object') SPEND = j._spend;

  return { ...SC.parse(j.answers || {}, task, variant), ms, ollamaMs: j._ollama_ms ?? j._model_ms, tokens: j.usage?.input_tokens, usd: j._usd, retries: j._retries || 0 };
}

async function decide(driver, task, mirror = false) {
  if (driver === 'model') {
    const res = await askModel(task);
    if (mirror) res.mirrors = [(await askModel(task, 1)).move, (await askModel(task, 2)).move];   // latence se měří jen u původního zadání
    return res;
  }
  const t0 = performance.now();
  const move = driver === 'oracle' ? SC.truth(task)[0] : SC.randomMove(task);
  return { move, ms: performance.now() - t0 };
}
