  'last.timetable': { cs: 'zásilka: PSČ {zip}, služba {service}\ntrasy:   {routes}\nvýjimky: {exceptions}\nzvoleno: {pick}  (správně: {truth})\nmodel:   depa a služby dostává anglicky (alder, birch, …; standard, express, …)', en: 'parcel:     ZIP {zip}, service {service}\nroutes:     {routes}\nexceptions: {exceptions}\nchosen:     {pick}  (correct: {truth})\nmodel:      gets the depots and services in English (alder, birch, …; standard, express, …)' },
  'last.tictactoe': { cs: 'hraje:   {you}\ndeska:   {board}\nzvoleno: {pick}  (správně: {truth}, {cls})', en: 'plays:   {you}\nboard:   {board}\nchosen:  {pick}  (correct: {truth}, {cls})' },
  'last.bandit': { cs: 'brány:   {gates}\nzvoleno: {pick}  (správně: {truth})\nmodel:   dostává průjezdy (drives) a výhry (wins), podíl ne', en: 'gates:   {gates}\nchosen:  {pick}  (correct: {truth})\nmodel:   gets drives and wins, not the share' },
  // „Poslední rozhodnutí“, řádky společné všem scénářům: doba rozhodnutí (u hostovaného modelu za ní počet tokenů) a výsledek úlohy se schovaným pokynem
  'last.ms': { cs: '{ms} ms', en: '{ms} ms' },
  'last.tokens': { cs: ', vstupních tokenů: {n}', en: ', input tokens: {n}' },
  'last.trojanResisted': { cs: 'trojský kůň: úloha se schovaným pokynem — odolal', en: 'Trojan horse: task with the hidden instruction — resisted' },
  'last.trojanFooled': { cs: 'trojský kůň: úloha se schovaným pokynem — podlehl', en: 'Trojan horse: task with the hidden instruction — fooled' },
  'last.trojanOther': { cs: 'trojský kůň: úloha se schovaným pokynem — jiná chyba', en: 'Trojan horse: task with the hidden instruction — different error' },
  // scénář překážky: popis pod silnicí, dlaždice Kvality (název .tile.<jméno>, popisek po najetí .tip.<jméno>)
  'scenario.obstacles.about': { cs: 'Překážky: v každé řadě je část pruhů zablokovaná. Model dostane vzdálenost k nejbližší překážce v každém pruhu a volí pruh s nejdelší volnou cestou; auto do něj přejede. „Správně“ = stejný pruh, jaký by zvolil ideální řidič. Náraz = auto bylo v zablokovaném pruhu ve chvíli, kdy k němu řada dojela. Špatných rozhodnutí bývá víc než nárazů: model se rozhoduje několikrát mezi dvěma řadami a většina chyb je jen horší volba, ne srážka.', en: 'Obstacles: in every row some of the lanes are blocked. The model gets the distance to the nearest obstacle in every lane and picks the lane with the longest free road; the car moves into it. "Correct" = the same lane the ideal driver would choose. Crash = the car was in a blocked lane at the moment the row reached it. There tend to be more wrong decisions than crashes: the model decides several times between two rows and most errors are just a worse choice, not a collision.' },
  'scenario.obstacles.tile.acc': { cs: 'správných rozhodnutí', en: 'correct decisions' },
  'scenario.obstacles.tip.acc': { cs: 'Podíl rozhodnutí, kde model zvolil stejný pruh jako ideální řidič (pruh s nejdelší volnou cestou; při shodě vlastní, jinak ten bližší). Počítá se každé rozhodnutí zvlášť a na jednu řadu jich připadá několik. Proto bývá špatných rozhodnutí víc než nárazů: většina chyb je jen horší volba, ne srážka.', en: 'The share of decisions where the model chose the same lane as the ideal driver (the lane with the longest free road; in a tie, the lane the car is already in, otherwise the closer one). Every decision counts separately and there are several of them per row. That is why there tend to be more wrong decisions than crashes: most errors are just a worse choice, not a collision.' },
  'scenario.obstacles.tile.crashes': { cs: 'nárazů', en: 'crashes' },
  'scenario.obstacles.tip.crashes': { cs: 'Kolikrát bylo auto v zablokovaném pruhu ve chvíli, kdy k němu řada překážek dojela. V reálném čase za náraz může i pomalé rozhodnutí, ne jen špatné. V benchmarku bez hry je „—“, tam auto nejede.', en: 'How many times the car was in a blocked lane at the moment the row of obstacles reached it. In Real time and Ladder modes a slow decision can cause a crash too, not only a wrong one. In the benchmark without the game it is "—", as the car does not move there.' },
  'scenario.obstacles.tile.dist': { cs: 'ujeto polí', en: 'cells driven' },
  'scenario.obstacles.tip.dist': { cs: 'Kolik polí auto v tomto běhu ujelo; řada překážek přijíždí každá 4 pole. S nastavenou délkou průjezdu běh skončí přesně na ní. V benchmarku bez hry je „—“.', en: 'How many cells the car has driven in this run; a row of obstacles arrives every 4 cells. With a run length set, the run ends exactly at that length. In the benchmark without the game it is "—".' },
  'scenario.obstacles.tile.blind': { cs: 'polí ujetých během 1 rozhodnutí', en: 'cells driven during 1 decision' },
  'scenario.obstacles.tip.blind': { cs: 'Rychlost auta × průměrná doba rozhodnutí: o kolik polí auto popojede, než odpověď dorazí. Čím je číslo větší, tím starší je stav, podle kterého model rozhodl; řady jsou od sebe 4 pole. Jen v reálném čase a v žebříku.', en: 'Car speed × mean decision time: how many cells the car moves forward before the answer arrives. The larger the number, the older the state the model based its decision on; the rows are 4 cells apart. In Real time and Ladder modes only.' },
  // scénáře s řadami (e-maily, číselné duely): společné dlaždice Kvality; názvy „špatně“ a „nestihl“ jsou result.bad a result.late
  'row.tip.bad': { cs: 'Řady, u kterých odpověď přišla včas, ale byla špatná — auto projelo jiným bodem nebo jinou branou. Ve výsledcích sloupec „chyby“. V benchmarku bez hry je „—“. U zákazů a výjimek auto projelo pruhem, kam vozidlo nesmí. U paměťové stopy auto projelo branou s jinou značkou, než se hledala. U závory auto projelo, kde mělo stát, stálo, kde mělo jet, nebo odpověď byla neplatná. U dvou kroků dopředu auto zvolilo jiný tah než ten, se kterým projede všechny 4 řady. U skrytého pravidla auto projelo jinou branou, než říká pravidlo. U nejkratší fronty auto vjelo do pruhu, který nemá nejkratší frontu. U sázky na pruh auto projelo branou, která nemá nejvyšší výplatu. U tempomatu auto zvolilo jiný stupeň rychlosti, než dává tabulka po srážkách. U jízdního řádu auto projelo branou jiného depa, než kam zásilka patří. U tahu na výhru auto zvolilo jiné pole, než říkají pravidla. U mýtných bran auto projelo jinou branou, než říká pravidlo.', en: 'Rows where the answer arrived in time but was wrong — the car passed through a different dot, a different gate (in memory trace, a gate with a sign other than the one to find) or, in bans and exceptions, a lane the vehicle may not enter; at the barrier, it went when it should have stopped, stopped when it should have gone, or the answer was invalid. In the results it is the "errors" column. In the benchmark without the game it is "—". For two steps ahead, the car made a move other than the one that gets it through all 4 rows. For the hidden rule, the car passed through a gate other than the one the rule asks for. For the shortest queue, the car joined a lane that does not have the shortest queue. For the bet on a lane, the car passed through a gate that does not have the highest payout. For the cruise control, the car picked a speed level other than the one the table gives after the reductions. For the timetable, the car passed through the gate of a depot other than the one the parcel belongs to. For the winning move the car picked a cell other than the one the rules give. For toll gates, the car passed through a gate other than the one the rule asks for.' },
  'row.tip.late': { cs: 'Řady, které minuly auto dřív, než k nim model stihl odpovědět. V reálném čase se model ptá na nejbližší řadu, kterou ještě může stihnout, a ostatní přeskočí; u modelu pomalejšího než rozestup řad je podíl zhruba 1 − interval ÷ latence. V režimu Po tazích nenastává.', en: 'Rows that passed the car before the model managed to answer them. In Real time and Ladder modes the page asks the model about the nearest row it can still answer in time and skips the others; for a model slower than the interval between rows, the share is roughly 1 − interval ÷ latency. This does not happen in Turn-based mode.' },
  'row.tile.acc': { cs: 'přesnost modelu', en: 'model accuracy' },
  'row.tip.acc': { cs: 'Podíl správných odpovědí ze všech odpovědí modelu, včetně těch, které přišly pozdě a auto už neřídily. Na rozdíl od první dlaždice nezávisí na rychlosti. Ve výsledcích sloupec „správně“.', en: 'The share of correct answers among all of the model\'s answers, including those that arrived late and no longer steered the car. Unlike the first tile, it does not depend on speed. In the results it is the "correct" column.' },
  'row.tip.rate': { cs: 'Požadováno = rychlost auta ÷ 4 (řady jsou po 4 polích), tedy kolik řad za sekundu přijíždí; jen v reálném čase. Rozhodnuto = počet rozhodnutí ÷ doba běhu. Když je rozhodnuto méně než požadováno, model nestíhá a přibývá „nestihl“. U dvou kroků dopředu jsou bloky po 6 polích, požadováno = rychlost ÷ 6. U nejkratší fronty jsou brány také po 6 polích, požadováno = rychlost ÷ 6. U jízdního řádu také, požadováno = rychlost ÷ 6. U tahu na výhru jsou desky po 6 polích, požadováno = rychlost ÷ 6.', en: 'Required = car speed ÷ 4 (the rows are 4 cells apart), that is, how many rows arrive per second; in Real time and Ladder modes only. Decided = number of decisions ÷ run duration. When decided is lower than required, the model does not keep up and the "missed" count grows. For two steps ahead the blocks are 6 cells apart, required = speed ÷ 6. For the shortest queue the gates are 6 cells apart too, required = speed ÷ 6. For the timetable too, required = speed ÷ 6. For the winning move the boards are 6 cells apart, required = speed ÷ 6.' },
  // scénář e-maily: karty fronty vedle silnice (přípony za názvem kategorie a za výsledkem řady), popis, tabulka záměn, dlaždice
  'card.inject': { cs: ' ⚠ s pokynem', en: ' ⚠ with the instruction' },
  'card.model': { cs: ' — model: {label}', en: ' — model: {label}' },
  'card.fooled': { cs: ' — podlehl pokynu', en: ' — fooled by the instruction' },
  'scenario.emails.about': { cs: 'E-maily: každá řada na silnici patří jednomu e-mailu z fronty vedle silnice. Model dostane jen předmět a text e-mailu a vybere kategorii; barvy nevidí. Auto pak zajede do pruhu, kde je v té řadě bod v barvě zvolené kategorie. Barva karty ve frontě je správná kategorie: když auto projede bodem stejné barvy, je to správně (zelený kroužek), jinou barvou špatně (červené bliknutí). Nestihl = odpověď nepřišla dřív, než řada dojela k autu.', en: 'E-mails: every row on the road belongs to one e-mail from the list of cards next to the road. The model gets only the subject and the text of the e-mail and picks a category; it does not see the colors. The car then moves into the lane where that row has a dot in the color of the chosen category. The color of the card in the list is the correct category: when the car passes through a dot of the same color, it is correct (green ring); through a dot of a different color, it is wrong (red flash). Missed = the answer did not arrive before the row reached the car.' },
  'scenario.emails.extraTitle': { cs: 'Záměny kategorií', en: 'Category confusions' },
  'scenario.emails.extraTip': { cs: 'Řádek je správná kategorie e-mailu, sloupec kategorie, kterou zvolil model; sloupec „?“ je odpověď mimo sadu. Čísla mimo úhlopříčku (červeně) jsou záměny. Počítají se všechny odpovědi modelu, i ty, které přišly pozdě.', en: 'A row is the correct category of the e-mail, a column is the category the model chose; the "?" column is an answer outside the dataset. The numbers off the diagonal (in red) are confusions. All of the model\'s answers count, including those that arrived late.' },
  'scenario.emails.confHead': { cs: 'správně ↓  zvoleno →', en: 'correct ↓  chosen →' },
  'scenario.emails.tile.match': { cs: 'shoda barev', en: 'color match' },
  'scenario.emails.tip.match': { cs: 'Kolika řadami auto projelo bodem správné barvy, ze všech projetých řad. Zahrnuje kvalitu i rychlost: řada, u které odpověď nepřišla včas, se počítá jako nezvládnutá. Čistou kvalitu modelu ukazuje dlaždice „přesnost modelu“.', en: 'The number of rows where the car passed through the dot of the correct color, out of all rows passed. It includes both quality and speed: a row where the answer did not arrive in time counts as failed. The "model accuracy" tile shows the pure quality of the model.' },
  'scenario.emails.tile.rate': { cs: 'e-mailů za sekundu: požadováno / rozhodnuto', en: 'e-mails per second: required / decided' },
  'scenario.emails.task': { cs: 'e-mail: {subject}', en: 'e-mail: {subject}' },
  // scénář číselné duely: popis, tabulka přesnosti podle rozdílu čísel, dlaždice
  'scenario.numbers.about': { cs: 'Číselné duely: v každé řadě je v každém pruhu brána s číslem. Model dostane jen ta čísla (bez dalšího kontextu) a má vybrat bránu s největším číslem; auto do ní zajede. Správně = auto projelo největším číslem (po průjezdu brána zezelená a dostane zelený kroužek), špatně = projelo jiným číslem, nestihl = odpověď nepřišla včas. Tabulka „Přesnost podle rozdílu čísel“ dělí výsledek podle toho, o kolik největší číslo vede před druhým největším: těsné do 5 %, střední 5–30 %, jasné nad 30 %. Test míří na známou slabinu těchto modelů — porovnávání čísel.', en: 'Number duels: in every row there is a gate with a number in every lane. The model gets only those numbers (with no other context) and has to pick the gate with the largest number; the car moves into it. Correct = the car passed through the largest number (after the car passes, the gate turns green and gets a green ring), wrong = it passed through a different number, missed = the answer did not arrive in time. The "Accuracy by number difference" table splits the result by how much the largest number leads the second largest: narrow up to 5%, medium 5–30%, clear over 30%. The test aims at a known weakness of these models — comparing numbers.' },
  'scenario.numbers.extraTitle': { cs: 'Přesnost podle rozdílu čísel', en: 'Accuracy by number difference' },
  'scenario.numbers.extraTip': { cs: 'Přesnost modelu zvlášť podle toho, o kolik největší číslo v řadě vede před druhým největším: těsné do 5 %, střední 5–30 %, jasné nad 30 %. Ukáže, jestli model chybuje jen u těsných rozdílů, nebo i u jasných. Počítají se všechny odpovědi, i pozdní.', en: 'Model accuracy separately by how much the largest number in the row leads the second largest: narrow up to 5%, medium 5–30%, clear over 30%. It shows whether the model makes errors only with narrow differences, or with clear ones too. All answers count, including the late ones.' },
  'scenario.numbers.col.gap': { cs: 'rozdíl největšího a druhého čísla', en: 'difference between the two largest numbers' },
  'scenario.numbers.col.ratio': { cs: 'správně / celkem', en: 'correct / total' },
  'scenario.numbers.tile.match': { cs: 'správná brána', en: 'correct gate' },
  'scenario.numbers.tip.match': { cs: 'Kolika řadami auto projelo branou s největším číslem, ze všech projetých řad. Řada, u které odpověď nepřišla včas, se počítá jako nezvládnutá. Čistou kvalitu modelu ukazuje dlaždice „přesnost modelu“.', en: 'The number of rows where the car passed through the gate with the largest number, out of all rows passed. A row where the answer did not arrive in time counts as failed. The "model accuracy" tile shows the pure quality of the model.' },
  'scenario.numbers.tile.rate': { cs: 'řad za sekundu: požadováno / rozhodnuto', en: 'rows per second: required / decided' },
  // scénář zákazy a výjimky: popis, tabulka přesnosti podle třídy značky (jména tříd sign.<třída> jako bench.sign.* v i18n.py; seznam je SIGN_NAME), štítek „kromě“ na silnici, dlaždice
  'scenario.signs.about': { cs: 'Zákazy a výjimky: v každé řadě je v každém pruhu dopravní značka a každá řada má vlastní vozidlo (štítek pod autem ukazuje typ, hmotnost a výšku vozidla nejbližší řady). Model dostane vozidlo a texty značek, například „buses only“, „no trucks“, „all vehicles except tractors“ nebo „no vehicles over 3.5 t“, a vybere jediný pruh, kam vozidlo smí; auto do něj zajede. Na silnici je značka jen symbol, celé texty ukazuje Poslední rozhodnutí. Správně = auto projelo povoleným pruhem (po průjezdu pruh zezelená a dostane zelený kroužek), špatně = projelo jiným pruhem, nestihl = odpověď nepřišla včas. Tabulka „Přesnost podle třídy značky“ dělí výsledek podle třídy značky povoleného pruhu.', en: 'Bans and exceptions: in every row there is a traffic sign in every lane, and every row has its own vehicle (the label under the car shows the type, weight and height of the vehicle of the nearest row). The model gets the vehicle and the texts of the signs, such as "buses only", "no trucks", "all vehicles except tractors" or "no vehicles over 3.5 t", and picks the one lane the vehicle may enter; the car moves into it. On the road a sign is only a symbol; the Last decision panel shows the full texts. Correct = the car passed through the open lane (after the car passes, the lane turns green and gets a green ring), wrong = it passed through a different lane, missed = the answer did not arrive in time. The "Accuracy by sign class" table splits the result by the class of the sign of the open lane.' },
  'scenario.signs.extraTitle': { cs: 'Přesnost podle třídy značky', en: 'Accuracy by sign class' },
  'scenario.signs.extraTip': { cs: 'Přesnost modelu zvlášť podle třídy značky povoleného pruhu: jen (buses only), jen výjimkou (no entry except buses), zákaz (no trucks), vše kromě (all vehicles except trucks), mez zákazem (no vehicles over 3.5 t) a mez do (vehicles up to 3.5 t only). Dvojice tříd mají stejnou podmínku a jinou formulaci; rozdíl mezi nimi ukáže, kterou formulaci model čte hůř. Počítají se všechny odpovědi, i pozdní.', en: 'Model accuracy separately by the class of the sign of the open lane: only (buses only), except-only (no entry except buses), no (no trucks), all-except (all vehicles except trucks), limit-no (no vehicles over 3.5 t) and limit-up-to (vehicles up to 3.5 t only). Pairs of classes share the condition and differ in wording; the difference between them shows which wording the model reads worse. All answers count, including the late ones.' },
  'scenario.signs.col.class': { cs: 'třída značky povoleného pruhu', en: 'class of the sign of the open lane' },
  'scenario.signs.col.ratio': { cs: 'správně / celkem', en: 'correct / total' },
  'scenario.signs.tile.match': { cs: 'správný pruh', en: 'correct lane' },
  'scenario.signs.tip.match': { cs: 'Kolika řadami auto projelo povoleným pruhem, ze všech projetých řad. Řada, u které odpověď nepřišla včas, se počítá jako nezvládnutá. Čistou kvalitu modelu ukazuje dlaždice „přesnost modelu“.', en: 'The number of rows where the car passed through the open lane, out of all rows passed. A row where the answer did not arrive in time counts as failed. The "model accuracy" tile shows the pure quality of the model.' },
  'scenario.signs.tile.rate': { cs: 'řad za sekundu: požadováno / rozhodnuto', en: 'rows per second: required / decided' },
  'sign.only': { cs: 'jen', en: 'only' },
  'sign.exceptOnly': { cs: 'jen výjimkou', en: 'except-only' },
  'sign.no': { cs: 'zákaz', en: 'no' },
  'sign.allExcept': { cs: 'vše kromě', en: 'all-except' },
  'sign.limitNo': { cs: 'mez zákazem', en: 'limit-no' },
  'sign.limitUpTo': { cs: 'mez do', en: 'limit-up-to' },
  'sign.except': { cs: 'kromě', en: 'except' },
  // scénář paměťová stopa: popis, tabulka přesnosti podle kroků zpět s řádkem chyb (memory.errors znak po znaku jako bench.memory.errors v i18n.py), pás historie, dlaždice
  'scenario.memory.about': { cs: 'Paměťová stopa: v každé řadě je v každém pruhu brána se značkou (kruh, čtverec, hvězda…) a každá řada má vlastní historii značek, které auto minulo. Rozhodovací model nemá paměť, proto je historie ve stavu: u každé značky štítek, kolik kroků zpět ji auto minulo (například „3 steps back“), a v poli target štítek hledané značky. Model nic nepamatuje, jen dohledá značku podle štítku a vybere bránu, která ji ukazuje; auto do ní zajede. Pás pod silnicí ukazuje historii nejbližší řady s nejnovější značkou vpravo a nad ní, kolik kroků zpět se hledá. Brány jsou souvislý úsek historie kolem hledané značky v zamíchaném pořadí. Správně = auto projelo branou s hledanou značkou (po průjezdu brána zezelená a dostane zelený kroužek), špatně = projelo jinou branou, nestihl = odpověď nepřišla včas. Tabulka „Přesnost podle kroků zpět“ dělí výsledek podle toho, o kolik kroků zpět se hledá (1 až 8).', en: 'Memory trace: in every row there is a gate with a sign (circle, square, star…) in every lane, and every row has its own history of signs the car passed. A decision model has no memory, so the history is in the state: every sign carries a label saying how many steps back the car passed it (such as "3 steps back"), and the target field holds the label of the sign to find. The model remembers nothing; it looks the sign up by its label and picks the gate that shows it, and the car moves into it. The strip under the road shows the history of the nearest row with the most recent sign on the right, and above it how many steps back to look. The gates are a run of consecutive signs from the history around the sign to find, in shuffled order. Correct = the car passed through the gate with the sign to find (after the car passes, the gate turns green and gets a green ring), wrong = it passed through a different gate, missed = the answer did not arrive in time. The "Accuracy by steps back" table splits the result by how many steps back the model has to look (1 to 8).' },
  'scenario.memory.extraTitle': { cs: 'Přesnost podle kroků zpět', en: 'Accuracy by steps back' },
  'scenario.memory.extraTip': { cs: 'Přesnost modelu zvlášť podle toho, o kolik kroků zpět se hledá (N = 1 až 8). Pod tabulkou je rozbor chyb jako v bench.py --memory: o krok vedle = zvolená značka je o krok novější nebo starší než hledaná, nejnovější značka = zvolená je ta naposledy minutá (a není o krok vedle), jiné = ostatní chybné brány, neplatné = odpověď mimo nabídku. Rozsah paměti je největší N, do kterého má každé N přesnost aspoň 80 %; „—“, když ji nemá ani N = 1. Na jedno N připadá jen osmina úloh, takže rozsah paměti je hrubý údaj. Počítají se všechny odpovědi, i pozdní.', en: 'Model accuracy separately by how many steps back the model has to look (N = 1 to 8). Below the table are the errors as in bench.py --memory: one step off = the chosen sign is one step newer or older than the sign to find, most recent sign = the chosen sign is the last one passed (and not one step off), other = the other wrong gates, invalid = an answer outside the list. The memory span is the largest N up to which every N is at least 80% correct; "—" when not even N = 1 is. Only an eighth of the tasks falls on each N, so the memory span is a rough estimate. All answers count, including the late ones.' },
  'scenario.memory.col.steps': { cs: 'hledaná značka', en: 'sign to find' },
  'scenario.memory.col.ratio': { cs: 'správně / celkem', en: 'correct / total' },
  'scenario.memory.tile.match': { cs: 'správná brána', en: 'correct gate' },
  'scenario.memory.tip.match': { cs: 'Kolika řadami auto projelo branou s hledanou značkou, ze všech projetých řad. Řada, u které odpověď nepřišla včas, se počítá jako nezvládnutá. Čistou kvalitu modelu ukazuje dlaždice „přesnost modelu“.', en: 'The number of rows where the car passed through the gate with the sign to find, out of all rows passed. A row where the answer did not arrive in time counts as failed. The "model accuracy" tile shows the pure quality of the model.' },
  'scenario.memory.tile.rate': { cs: 'řad za sekundu: požadováno / rozhodnuto', en: 'rows per second: required / decided' },
  'memory.steps': { cs: 'před {n} {n|krokem|kroky}', en: '{n} {n|step|steps} back' },
  'memory.seek': { cs: 'hledá se značka před {n} {n|krokem|kroky}', en: 'looking for the sign {n} {n|step|steps} back' },
  'memory.errors': { cs: 'chyby: o krok vedle {near}, nejnovější značka {latest}, jiné {other}, neplatné {invalid}; rozsah paměti {span}', en: 'errors: one step off {near}, most recent sign {latest}, other {other}, invalid {invalid}; memory span {span}' },
  // scénář závora: popis, tabulka přesnosti podle pravidla a třídy, řádek chyb a AUROC (třídy, chyby a AUROC znak po znaku jako bench.barrier.errors v i18n.py), dlaždice
  'scenario.barrier.about': { cs: 'Závora: každá řada je křižovatka se závorou přes celou silnici. U ní je semafor a dopravní značka, podle úlohy i policista, záchranka a chodec na přechodu. Model dostane stav křižovatky slovy (pět polí: police_officer, emergency_vehicle, pedestrian_on_crossing, light, sign) a v zadání pět pravidel s pořadím: policista, záchranka se sirénou, chodec na přechodu, semafor, při zhasnutém semaforu značka. Na otázku typu noul odpoví pravděpodobností, že auto smí projet; auto jede při hodnotě aspoň 0,5. Pravidla jsou v zadání, takže scénář měří čtení zadání a stavu, ne znalost předpisů. Tři čtvrtiny křižovatek jsou „jeď“. Před řadou se ukáže rozhodnutí modelu: JEĎ nebo STŮJ s hodnotou noul. Při „jeď“ se závora zvedne s předstihem a auto projede. Při „stůj“, které přijde včas, auto u závory zastaví asi na 0.8 s (závora dole, brzdová světla), pak se závora zvedne a auto jede dál; doba stání se do „rozhodnutí za sekundu“ nepočítá. Po průjezdu nese výsledek štítek se slovem: projel nebo zastavil (správně), projel a měl stát (náraz), zastavil zbytečně, neplatná odpověď (auto nezastaví), nestihl (odpověď nepřišla včas, auto jede, a když mělo stát, narazí). Po průjezdu se u řady ukáže rozhodující pravidlo. Tabulka „Přesnost podle pravidla“ dělí výsledek podle rozhodujícího pravidla a třídy úlohy. Jistota je max(p, 1 − p) z odpovědi, model ji nevrací.', en: 'Barrier: every row is an intersection with a barrier across the whole road. Next to it there is a traffic light and a traffic sign and, depending on the task, a police officer, an emergency vehicle and a pedestrian on the crossing. The model gets the state of the intersection in words (five fields: police_officer, emergency_vehicle, pedestrian_on_crossing, light, sign), and the prompt lists five rules in order of priority: police officer, emergency vehicle with its siren on, pedestrian on the crossing, traffic light and, with the light off, the sign. It answers a noul question with the probability that the car may drive through; the car goes at a value of 0.5 or more. The rules are in the prompt, so the scenario measures reading the prompt and the state, not knowing the traffic code. Three quarters of the intersections are "go". Before the row the page shows the decision of the model: GO or STOP with the noul value. On "go" the barrier rises early and the car drives through. On a "stop" that arrives in time the car stops at the barrier for about 0.8 s (barrier down, brake lights on), then the barrier rises and the car drives on; the time spent standing does not count towards "decisions per second". After the car passes, a label names the result in words: drove through or stopped (correct), drove through when it should have stopped (a crash), stopped needlessly, invalid answer (the car does not stop), missed (the answer did not arrive in time, the car goes, and if it should have stopped, it crashes). After the car passes, the row shows the deciding rule. The "Accuracy by rule" table splits the result by the deciding rule and by the class of the task. The confidence is max(p, 1 − p) from the answer; the model does not return it.' },
  'scenario.barrier.extraTitle': { cs: 'Přesnost podle pravidla', en: 'Accuracy by rule' },
  'scenario.barrier.extraTip': { cs: 'Přesnost modelu podle pravidla, které úlohu rozhoduje (1 policista, 2 záchranka, 3 chodec, 4 semafor, 5 značka), a podle třídy úlohy jako v bench.py --barrier: shodné = semafor, při off značka, říká totéž co rozhodující pravidlo (u pravidla 4 značka); přebitý semafor = vyšší pravidlo (policista, záchranka, chodec) říká opak než semafor, při off značka; semafor přebil značku = semafor říká opak než značka; poslední pravidlo = rozhoduje značka. Pod tabulkou: falešný průjezd (jelo, mělo stát) a zbytečné stání (stálo, mělo jet) jako počet z úloh stůj a jeď, neplatné odpovědi, pozdní řady (jen ve hře; řada bez odpovědi do falešného průjezdu nepatří), AUROC (jak dobře hodnota noul řadí úlohy jeď nad úlohy stůj; 0,5 = náhoda) a nejlepší práh s vyváženou přesností (průměr podílu správných na úlohách jeď a na úlohách stůj). Počítají se všechny odpovědi, i pozdní. U řidičů Pravidla a Náhodně je hodnota noul 1 pro jeď a 0 pro stůj. Jistota v grafu kalibrace je max(p, 1 − p); model ji nevrací.', en: 'Model accuracy by the rule that decides the task (1 police officer, 2 emergency vehicle, 3 pedestrian, 4 light, 5 sign) and by the class of the task as in bench.py --barrier: agree = the light, or the sign when the light is off, says the same as the deciding rule (for rule 4, the sign); light overridden = a higher rule (police officer, emergency vehicle, pedestrian) says the opposite of the light, or of the sign when the light is off; light over sign = the light says the opposite of the sign; last rule = the sign decides. Below the table: false go (went when it should have stopped) and needless stop (stopped when it should have gone) as counts out of the stop and go tasks, invalid answers, late rows (in the game only; a row without an answer is not a false go), AUROC (how well the noul value ranks go tasks above stop tasks; 0.5 = chance) and the best threshold with its balanced accuracy (the mean of the shares correct on go tasks and on stop tasks). All answers count, including the late ones. For the Rules and Random drivers the noul value is 1 for go and 0 for stop. The confidence in the calibration chart is max(p, 1 − p); the model does not return it.' },

  'scenario.barrier.col.ratio': { cs: 'správně / celkem', en: 'correct / total' },

  'scenario.barrier.tip.match': { cs: 'Kolika řadami auto projelo nebo před nimi zastavilo správně, ze všech projetých řad. Řada, u které odpověď nepřišla včas, se počítá jako nezvládnutá. Čistou kvalitu modelu ukazuje dlaždice „přesnost modelu“.', en: 'The number of rows where the car correctly went or stopped, out of all rows passed. A row where the answer did not arrive in time counts as failed. The "model accuracy" tile shows the pure quality of the model.' },
  'scenario.barrier.tile.falseGo': { cs: 'falešný průjezd', en: 'false go' },
  'scenario.barrier.tip.falseGo': { cs: 'Kolikrát model řekl jeď na křižovatce, kde měl stát, z úloh stůj, na které odpověděl (i pozdě). Nejhorší chyba: auto narazí. Stejné číslo je pod tabulkou „Přesnost podle pravidla“.', en: 'How many times the model said go at an intersection where it should have stopped, out of the stop tasks it answered (late answers included). The worst error: the car crashes. The same number is below the "Accuracy by rule" table.' },

  // scénář dva kroky dopředu: popis, tabulka přesnosti podle hloubky pasti s řádkem chyb (lookahead.depth a lookahead.errors znak po znaku jako bench.lookahead.* v i18n.py), dlaždice
  'scenario.lookahead.about': { cs: 'Dva kroky dopředu: každá řada je blok 4 řad s mezerami přes celou silnici s kostkami překážek. Auto stojí v pruhu, který patří úloze, a model volí tah pro nejbližší řadu: o pruh vlevo, zůstat, nebo o pruh vpravo. Před každou další řadou se auto smí posunout nejvýš o pruh a ze silnice nesmí. Správný tah je v každé úloze jediný a auto s ním projede všechny 4 řady. Model dostane číslo pruhu auta a u každé řady čísla zablokovaných pruhů. Hladový řidič jede do pruhu s nejdelší volnou dráhou rovně a v části úloh tím vjede do slepé uličky. Před blokem ukáže modrá šipka zvolený tah; auto jede po tahu a mezi řadami mění pruh v mezeře. Po průjezdu ukáže zelená čára v bloku správnou cestu a po chybném tahu oranžová cestu hladového řidiče, když se liší. Náraz nebo slepá ulička = červený křížek u kostky a auto projede zbytek bloku poloprůhledně. Štítek pod autem jmenuje výsledek: správný tah, náraz v řadě N, mimo silnici, slepá ulička v řadě N, neplatná odpověď, nestihl (odpověď nepřišla včas, auto zůstane v pruhu a projede blok poloprůhledně). Bloky přijíždějí po 6 polích. Tabulka „Přesnost podle hloubky pasti“ dělí výsledek podle toho, kolik nejbližších řad musí model zvážit (1, 2, 3 a víc). Pruhů je 3 až 8.', en: 'Two steps ahead: every row is a block of 4 rows with gaps between them across the whole road with obstacles in it. The car starts in the lane that belongs to the task, and the model picks the move for the nearest row: one lane to the left, stay, or one lane to the right. Before every further row the car may shift by at most one lane, and it must stay on the road. Every task has exactly one right move, and with it the car gets through all 4 rows. The model gets the number of the lane the car is in and, for every row, the numbers of the blocked lanes. A greedy driver heads for the lane with the longest free run straight ahead, and in part of the tasks that leads into a dead end. Before the block a blue arrow shows the chosen move; the car follows the move and changes lanes in the gaps between the rows. After the car passes, a green line in the block shows the right path and, after a wrong move, an orange line the path of the greedy driver when it differs. A crash or a dead end = a red cross at the cube, and the car drives through the rest of the block see-through. A label under the car names the result: right move, crash in row N, off the road, dead end in row N, invalid answer, missed (the answer did not arrive in time, the car stays in its lane and drives through the block see-through). The blocks arrive every 6 cells. The "Accuracy by trap depth" table splits the result by how many of the nearest rows the model has to weigh (1, 2, 3 or more). There are 3 to 8 lanes.' },
  'scenario.lookahead.extraTitle': { cs: 'Přesnost podle hloubky pasti', en: 'Accuracy by trap depth' },
  'scenario.lookahead.extraTip': { cs: 'Přesnost modelu podle hloubky pasti jako v bench.py --lookahead: hloubka 1 = stačí nenarazit hned v nejbližší řadě, hloubka 2 = správný tah ukáže až druhá řada, hloubka 3+ = až třetí nebo čtvrtá. Pod tabulkou rozbor chybných tahů jako v bench.py: tah hladového řidiče (pruh s nejdelší volnou dráhou rovně), náraz nebo mimo silnici, jiné, neplatné. V hloubce 2 a 3+ generátor hlídá, aby tah hladového řidiče, tah k pruhu s nejvíc volnými poli kolem (od 4 pruhů) a tah ke středu silnice (od 5 pruhů) trefily správný tah jen asi v třetině úloh; při 3 pruzích to u dvou posledních nejde. Počítají se všechny odpovědi, i pozdní.', en: 'Model accuracy by trap depth as in bench.py --lookahead: depth 1 = it is enough not to crash in the nearest row, depth 2 = the second row shows the right move, depth 3+ = only the third or fourth row does. Below the table are the wrong moves as in bench.py: the move of the greedy driver (the lane with the longest free run straight ahead), a crash or a move off the road, other, invalid. At depths 2 and 3+ the generator keeps the greedy move, the move towards the lane with the most free cells around it (from 4 lanes) and the move towards the middle of the road (from 5 lanes) right in only about a third of the tasks; with 3 lanes this is not possible for the last two. All answers count, including the late ones.' },
  'scenario.lookahead.col.depth': { cs: 'hloubka pasti', en: 'trap depth' },
  'scenario.lookahead.col.ratio': { cs: 'správně / celkem', en: 'correct / total' },
  'scenario.lookahead.tile.match': { cs: 'správný tah', en: 'correct move' },
  'scenario.lookahead.tip.match': { cs: 'Kolika bloky auto projelo se správným tahem, ze všech projetých bloků. Blok, u kterého odpověď nepřišla včas, se počítá jako nezvládnutý. Čistou kvalitu modelu ukazuje dlaždice „přesnost modelu“.', en: 'The number of blocks the car passed with the right move, out of all blocks passed. A block where the answer did not arrive in time counts as failed. The "model accuracy" tile shows the pure quality of the model.' },
  'scenario.lookahead.tile.greedy': { cs: 'tah hladového řidiče', en: 'greedy move' },
  'scenario.lookahead.tip.greedy': { cs: 'Kolik chybných odpovědí byl tah hladového řidiče (do pruhu s nejdelší volnou dráhou rovně), ze všech chybných a neplatných odpovědí (i pozdních). Stejné číslo je pod tabulkou „Přesnost podle hloubky pasti“.', en: 'How many of the wrong answers were the greedy move (towards the lane with the longest free run straight ahead), out of all wrong and invalid answers (late ones included). The same number is below the "Accuracy by trap depth" table.' },

  'legend.lookahead.move': { cs: 'před každou řadou smí auto o pruh vlevo, zůstat, nebo o pruh vpravo', en: 'ahead of every row the car may move one lane left, stay, or move one lane right' },
  'legend.lookahead.first': { cs: 'model volí jen první tah (šipka), zbytek cesty auto dojede nejlepší možnou cestou', en: 'the model picks only the first move (the arrow); the car drives the rest along the best possible path' },
  'legend.lookahead.paths': { cs: 'po průjezdu: zelená = správná cesta, oranžová = cesta hladového řidiče, křížek = náraz', en: 'after the car passes: green = the right path, orange = the path of the greedy driver, cross = crash' },
  // scénář skryté pravidlo: popis, tabulka přesnosti podle třídy s řádkem pod ní (rule.class.* a rule.line znak po znaku jako bench.rule.* v i18n.py), znaky bran, pás deníku, dlaždice
  'scenario.rule.about': { cs: 'Skryté pravidlo: každá řada má 3 brány a každá ukazuje jen znak, ve kterém se shoduje se vzorem: barvu (barevná skvrna), tvar (obrys) nebo počet (tečky). Skryté pravidlo říká, který znak je správný, a po každých 3 správných pokusech v řadě se mění na jiný znak. Každá řada nese vlastní deník dřívějších pokusů (u každého znak zvolené brány a jestli byl pokus správný); pás pod silnicí ukazuje deník nejbližší řady s nejstarším pokusem vlevo a svislou čarou tam, kde se pravidlo změnilo. Model dostane deník a znaky bran, tedy totéž co divák, a volí bránu podle pravidla, které platí teď. Třídy úloh jako v bench.py --rule: opakování (od poslední změny byl správný pokus), přepnutí (pravidlo se změnilo a nové zbývá vyloučením) a vyloučení (bez změny, dva různé špatné pokusy). Pod znakem brány stojí „shoda: …“, tedy v čem se brána shoduje se vzorem. Jakmile model odpoví, modrý obrys ukáže zvolenou bránu. Po průjezdu správná brána zezelená a pod řadou se ukáže štítek: „✓ platí: …“ (auto projelo branou podle pravidla), „✗ zvolil …, platí …“ (jinou branou), ve třídě přepnutí u brány starého pravidla „✗ perseverace: …“, „✗ neplatná odpověď“, nebo „⏱ nestihl“ (odpověď nepřišla včas). Brána, kterou deník vylučuje, je přeškrtnutá: „staré pravidlo, neplatí“ (po změně platí jiný znak) a „vyřazeno: ✗ po změně“ (znak, který od poslední změny dostal ✗); nepřeškrtnutá zbude jen jedna. V deníku pod silnicí stojí u čáry změny „změna pravidla“ a otazník za posledním pokusem znamená, že model teď volí. Tabulka „Přesnost podle třídy“ dělí výsledek podle třídy úlohy.', en: 'Hidden rule: every row has 3 gates, and every gate shows only the feature it shares with the sample: the color (a colored spot), the shape (an outline) or the count (dots). A hidden rule says which feature is right, and after every 3 correct picks in a row it changes to another feature. Every row carries its own log of earlier picks (for each, the feature of the picked gate and whether the pick was correct); the strip under the road shows the log of the nearest row with the oldest pick on the left and a vertical line where the rule changed. The model gets the log and the features of the gates, the same as the viewer, and picks the gate by the rule in force now. The classes of the tasks are as in bench.py --rule: repeat (a correct pick since the last change), switch (the rule has changed and ruling out leaves the new one) and eliminate (no change, two different wrong picks). Under the feature of a gate it says "match: …", that is, what the gate shares with the sample. As soon as the model answers, a blue outline marks the picked gate. After the car passes, the right gate turns green and a label appears under the row: "✓ in force: …" (the car passed through the gate the rule asks for), "✗ picked …, in force: …" (through another gate), in the switch class at the gate of the old rule "✗ perseveration: …", "✗ invalid answer", or "⏱ missed" (the answer did not arrive in time). A gate the log rules out is crossed out: "old rule, no longer holds" (after a change another feature is in force) and "ruled out: ✗ after the change" (a feature that got ✗ since the last change); only one gate is left uncrossed. In the log under the road the line of a change says "rule change", and a question mark after the last pick means that the model is picking now. The "Accuracy by class" table splits the result by the class of the task.' },
  'scenario.rule.extraTitle': { cs: 'Přesnost podle třídy', en: 'Accuracy by class' },
  'scenario.rule.extraTip': { cs: 'Přesnost modelu podle třídy úlohy jako v bench.py --rule: opakování = od poslední změny pravidla byl správný pokus a ten pravidlo určuje; přepnutí = pravidlo se změnilo, od změny nebyl správný pokus a nové pravidlo zbývá po vyloučení starého znaku a špatných pokusů; vyloučení = pravidlo se ještě neměnilo a dva různé špatné pokusy nechávají třetí znak. Pod tabulkou jako v bench.py: přesnost u krátkého deníku (3 až 5 pokusů) a dlouhého (6 až 10) a perseverace, tedy kolikrát model ve třídě přepnutí zvolil bránu starého pravidla, z úloh přepnutí. Neplatná odpověď se do perseverace nepočítá. Ve třídě přepnutí generátor hlídá, aby znak, který se v deníku objevil nejméně často, trefil pravidlo jen asi v třetině úloh. Počítají se všechny odpovědi, i pozdní.', en: 'Model accuracy by the class of the task as in bench.py --rule: repeat = there was a correct pick since the last change of the rule, and it gives the rule; switch = the rule has changed, no pick since the change was correct, and the new rule is what is left after ruling out the old feature and the wrong picks; eliminate = the rule has not changed yet, and two different wrong picks leave the third feature. Below the table, as in bench.py: the accuracy for short logs (3 to 5 picks) and long ones (6 to 10), and the perseveration, how many times the model picked the gate of the old rule in the switch class, out of the switch tasks. An invalid answer does not count as perseveration. In the switch class the generator keeps the feature that appears least often in the log right in only about a third of the tasks. All answers count, including the late ones.' },
  'scenario.rule.col.class': { cs: 'třída úlohy', en: 'class of the task' },
  'scenario.rule.col.ratio': { cs: 'správně / celkem', en: 'correct / total' },
  'scenario.rule.tile.match': { cs: 'správná brána', en: 'correct gate' },
  'scenario.rule.tip.match': { cs: 'Kolika řadami auto projelo branou podle pravidla, ze všech projetých řad. Řada, u které odpověď nepřišla včas, se počítá jako nezvládnutá. Čistou kvalitu modelu ukazuje dlaždice „přesnost modelu“.', en: 'The number of rows where the car passed through the gate the rule asks for, out of all rows passed. A row where the answer did not arrive in time counts as failed. The "model accuracy" tile shows the pure quality of the model.' },
  'scenario.rule.tip.persev': { cs: 'Kolikrát model ve třídě přepnutí zvolil bránu starého pravidla, z úloh přepnutí, na které odpověděl (i pozdě). Hlavní metrika scénáře: model drží pravidlo, které už neplatí. Stejné číslo je pod tabulkou „Přesnost podle třídy“.', en: 'How many times the model picked the gate of the old rule in the switch class, out of the switch tasks it answered (late answers included). The main metric of the scenario: the model sticks to a rule that no longer holds. The same number is below the "Accuracy by class" table.' },
  'scenario.rule.tile.rate': { cs: 'řad za sekundu: požadováno / rozhodnuto', en: 'rows per second: required / decided' },
  'rule.class.repeat': { cs: 'opakování', en: 'repeat' },

  'legend.rule.rule': { cs: 'Skryté pravidlo říká, který znak platí. Po 3 správných pokusech v řadě se změní.', en: 'The hidden rule says which feature is right. After 3 correct picks in a row it changes.' },
  'legend.rule.out': { cs: 'Přeškrtnutá brána je vyloučená: staré pravidlo (po změně neplatí) nebo znak, který od poslední změny dostal ✗. Nepřeškrtnutá zbude jen jedna.', en: 'A crossed-out gate is ruled out: the old rule (no longer holds after a change) or a feature that got ✗ since the last change. Only one gate is left uncrossed.' },
  'legend.rule.log': { cs: 'Deník pod silnicí: znak dříve zvolené brány, ✓ správně, ✗ špatně; ? = teď volí model.', en: 'Log under the road: the feature of an earlier picked gate, ✓ correct, ✗ wrong; ? = the model is picking now.' },
  // scénář nejkratší fronta (i vážená): popis, tabulka přesnosti podle rozdílu front s řádkem chyb (queue.gap, queue.errors, queue.errorsWeighted znak po znaku jako bench.queue.* v i18n.py), dlaždice
  'scenario.queue.about': { cs: 'Nejkratší fronta: každá řada je mýtná brána a v každém pruhu před ní čeká fronta 1 až 12 vozidel. Model dostane seznam vozidel v každém pruhu a volí pruh s nejkratší frontou; nejkratší fronta je vždy jediná. Čím delší fronta, tím delší sloupec vozidel; budka brány je nahoře a konec fronty dole u auta. Po odpovědi modrý obrys ukáže zvolený pruh, auto do něj vjede a na konci fronty se řada vyhodnotí. Po průjezdu jsou nad budkami délky front, nejkratší pruh je zelený a štítek pod řadou říká, který pruh model zvolil a který byl nejkratší. Tabulka „Přesnost podle rozdílu front“ dělí výsledek podle toho, o kolik je nejkratší fronta kratší než druhá (1, 2–3, 4 a víc). Brány přijíždějí po 6 polích, pruhů je 2 až 8.', en: 'Shortest queue: every row is a toll gate, and in every lane a queue of 1 to 12 vehicles waits in front of it. The model gets the list of vehicles in every lane and picks the lane with the shortest queue; the shortest queue is always unique. The longer the queue, the longer the column of vehicles; the gate booth is at the top and the end of the queue at the bottom, next to the car. After the answer a blue outline marks the chosen lane, the car moves into it, and the row is scored at the end of the queue. After the car passes, the lengths of the queues are above the booths, the shortest lane is green, and the label under the row says which lane the model picked and which one was the shortest. The "Accuracy by queue difference" table splits the result by how much shorter the shortest queue is than the next one (1, 2–3, 4 or more). The gates arrive every 6 cells, there are 2 to 8 lanes.' },
  'scenario.queueWeighted.about': { cs: 'Nejkratší fronta (vážená): jako nejkratší fronta, ale nákladní auto, autobus a traktor se počítají za 3 vozidla; model to má v zadání. Na silnici jsou tato vozidla oranžová a 3× vyšší, takže délka sloupce je vážená délka fronty. V polovině úloh má nejméně vozidel jiný pruh, než je nejkratší vážená fronta: kdo počítá bez vah, tam chybuje, a štítek pod řadou to řekne. Tabulka „Přesnost podle rozdílu front“ dělí výsledek podle rozdílu vážených délek (1, 2–3, 4 a víc). Brány přijíždějí po 6 polích, pruhů je 2 až 8.', en: 'Shortest queue (weighted): like the shortest queue, but a truck, a bus and a tractor count as 3 vehicles, and the prompt says so. On the road these vehicles are orange and 3 times as tall, so the length of a column is the weighted length of the queue. In half of the tasks the lane with the fewest vehicles is not the shortest weighted queue: counting without weights fails there, and the label under the row says so. The "Accuracy by queue difference" table splits the result by the difference of the weighted lengths (1, 2–3, 4 or more). The gates arrive every 6 cells, there are 2 to 8 lanes.' },
  'scenario.queue.extraTitle': { cs: 'Přesnost podle rozdílu front', en: 'Accuracy by queue difference' },
  'scenario.queue.extraTip': { cs: 'Přesnost modelu podle rozdílu nejkratší a druhé nejkratší fronty jako v bench.py --queue: rozdíl 1, rozdíl 2–3, rozdíl 4+. Pod tabulkou rozbor chybných odpovědí jako v bench.py: nejkratší text (pruh, jehož seznam vozidel je jako text nejkratší), u vážené fronty i nejkratší podle počtu (bez vah), jiné, neplatné. Při rozdílu 1 a 2–3 generátor hlídá, aby nejkratší text trefil správný pruh jen asi v třetině úloh (při 2 pruzích v polovině); při rozdílu 4+ to nejde. Počítají se všechny odpovědi, i pozdní.', en: 'Model accuracy by the difference between the shortest and the second shortest queue as in bench.py --queue: difference 1, difference 2–3, difference 4+. Below the table are the wrong answers as in bench.py: the shortest text (the lane whose list of vehicles is the shortest as text), for the weighted queue also the shortest by count (unweighted), other, invalid. At differences 1 and 2–3 the generator keeps the shortest text right in only about a third of the tasks (in half of them with 2 lanes); at 4+ that is not possible. All answers count, including the late ones.' },
  'scenario.queue.col.gap': { cs: 'rozdíl front', en: 'queue difference' },
  'scenario.queue.col.ratio': { cs: 'správně / celkem', en: 'correct / total' },
  'scenario.queue.tile.match': { cs: 'pruh s nejkratší frontou', en: 'lane with the shortest queue' },
  'scenario.queue.tile.rate': { cs: 'bran za sekundu: požadováno / rozhodnuto', en: 'gates per second: required / decided' },
  'scenario.queue.tip.match': { cs: 'Kolika řadami auto projelo pruhem s nejkratší frontou, ze všech projetých řad. Řada, u které odpověď nepřišla včas, se počítá jako nezvládnutá. Čistou kvalitu modelu ukazuje dlaždice „přesnost modelu“.', en: 'The number of rows the car passed in the lane with the shortest queue, out of all rows passed. A row where the answer did not arrive in time counts as failed. The "model accuracy" tile shows the pure quality of the model.' },
  'scenario.queueWeighted.tile.count': { cs: 'nejméně vozidel bez vah', en: 'fewest vehicles, unweighted' },
  'scenario.queueWeighted.tip.count': { cs: 'Kolik chybných odpovědí byl pruh s nejméně vozidly podle počtu bez vah, ze všech chybných a neplatných odpovědí (i pozdních). Stejné číslo je pod tabulkou „Přesnost podle rozdílu front“.', en: 'How many of the wrong answers were the lane with the fewest vehicles by count, without weights, out of all wrong and invalid answers (late ones included). The same number is below the "Accuracy by queue difference" table.' },
  'queue.label.ok': { cs: '✓ pruh {n}: nejkratší fronta ({len})', en: '✓ lane {n}: the shortest queue ({len})' },
  'queue.label.bad': { cs: '✗ pruh {pick} ({pickLen}), nejkratší je pruh {n} ({len})', en: '✗ lane {pick} ({pickLen}), the shortest is lane {n} ({len})' },
  'queue.label.count': { cs: '✗ pruh {pick}: nejméně vozidel, ale váha {pickLen}; nejkratší pruh {n} ({len})', en: '✗ lane {pick}: the fewest vehicles, but weight {pickLen}; the shortest is lane {n} ({len})' },
  'legend.queue.queue': { cs: 'fronta = sloupec vozidel v pruhu; budka mýtné brány nahoře, konec fronty dole u auta', en: 'queue = a column of vehicles in a lane; the toll booth at the top, the end of the queue at the bottom next to the car' },
  'legend.queue.pick': { cs: 'model volí pruh s nejkratší frontou; modrý obrys = jeho volba', en: 'the model picks the lane with the shortest queue; blue outline = its pick' },
  'legend.queue.out': { cs: 'po průjezdu: nad budkou délka fronty, nejkratší pruh zeleně', en: 'after the car passes: the length of the queue above the booth, the shortest lane in green' },
  'legend.queue.heavy': { cs: 'oranžové = nákladní auto, autobus, traktor: počítá se za 3 vozidla, proto je 3× vyšší', en: 'orange = a truck, a bus, a tractor: counts as 3 vehicles, so it is 3 times as tall' },
  'queue.gap': { cs: 'rozdíl {d}', en: 'difference {d}' },
  'queue.errors': { cs: 'chyby: nejkratší text {text}, jiné {other}, neplatné {invalid}', en: 'errors: shortest text {text}, other {other}, invalid {invalid}' },
  'queue.errorsWeighted': { cs: 'chyby: nejkratší podle počtu (bez vah) {count}, nejkratší text {text}, jiné {other}, neplatné {invalid}', en: 'errors: shortest by count (unweighted) {count}, shortest text {text}, other {other}, invalid {invalid}' },
  // scénář sázka na pruh: popis, tabulka přesnosti podle úrovně s řádkem pod ní (bet.level.* a bet.line znak po znaku jako bench.bet.* v i18n.py), dlaždice, legenda
  'scenario.bet.about': { cs: 'Sázka na pruh: každá řada má v každém pruhu bránu, která vyplatí svou odměnu s danou šancí v procentech, jinak nic. Model dostane odměnu a šanci každé brány a volí bránu s nejvyšší očekávanou výplatou, tedy odměna × šance; ta je vždy jediná a aspoň o 5 % vyšší než u ostatních bran. Na bráně je nahoře odměna a dole šance. Po průjezdu se pod branami ukáže výplata a brána s nejvyšší výplatou zezelená. Úlohy jsou ve třech úrovních: stejná šance u všech bran (stačí najít nejvyšší odměnu), šance 50 nebo 100 % (brána se 100 % je vždy špatně) a obecná šance 10–95 %, kde nejvyšší odměna i nejvyšší šance trefí správnou bránu jen asi v třetině úloh. Tabulka „Přesnost podle úrovně“ dělí výsledek podle úrovně, pod ní je ztráta výplaty (regret) a počet voleb nejvyšší odměny a nejvyšší šance. Bran je 3 až 8.', en: 'Bet on a lane: every row has a gate in every lane that pays out its reward with the given chance in percent and nothing otherwise. The model gets the reward and the chance of every gate and picks the gate with the highest expected payout, that is, the reward times the chance; it is always unique and at least 5% higher than at any other gate. The gate shows the reward at the top and the chance at the bottom. After the car passes, the payouts appear under the gates and the gate with the highest payout turns green. The tasks come in three levels: the same chance at every gate (finding the highest reward is enough), chances of 50 or 100% (the gate with 100% is always wrong) and a general chance from 10 to 95%, where the highest reward and the highest chance each hit the right gate in only about a third of the tasks. The "Accuracy by level" table splits the result by level; below it are the payout lost (regret) and the number of picks of the highest reward and the highest chance. There are 3 to 8 gates.' },
  'scenario.bet.extraTitle': { cs: 'Přesnost podle úrovně', en: 'Accuracy by level' },
  'scenario.bet.extraTip': { cs: 'Přesnost modelu podle úrovně jako v bench.py --bet: stejná šance = všechny brány mají stejnou šanci, 50 nebo 100 % = šance jen 50 nebo 100 % a brána se 100 % je špatně, obecná = šance 10–95 %. Pod tabulkou regret (průměrná ztráta výplaty proti nejlepší bráně, neplatná odpověď = celá výplata) a chyby jako v bench.py: zvolena brána s nejvyšší odměnou, s nejvyšší šancí, jiná, neplatné. Počítají se všechny odpovědi, i pozdní.', en: 'Model accuracy by level as in bench.py --bet: same chance = every gate has the same chance, 50 or 100% = chances of 50 or 100% only and the gate with 100% is wrong, general = chances from 10 to 95%. Below the table are the regret (the mean loss of payout against the best gate; an invalid answer loses the whole payout) and the errors as in bench.py: the gate with the highest reward, with the highest chance, other, invalid. All answers count, including the late ones.' },
  'scenario.bet.col.level': { cs: 'úroveň', en: 'level' },
  'scenario.bet.col.ratio': { cs: 'správně / celkem', en: 'correct / total' },
  'scenario.bet.tile.match': { cs: 'brána s nejvyšší výplatou', en: 'gate with the highest payout' },
  'scenario.bet.tile.regret': { cs: 'ztráta výplaty (regret)', en: 'payout lost (regret)' },
  'scenario.bet.tile.rate': { cs: 'řad za sekundu: požadováno / rozhodnuto', en: 'rows per second: required / decided' },
  'scenario.bet.tip.match': { cs: 'Kolika řadami auto projelo branou s nejvyšší výplatou, ze všech projetých řad. Řada, u které odpověď nepřišla včas, se počítá jako nezvládnutá. Čistou kvalitu modelu ukazuje dlaždice „přesnost modelu“.', en: 'The number of rows the car passed through the gate with the highest payout, out of all rows passed. A row where the answer did not arrive in time counts as failed. The "model accuracy" tile shows the pure quality of the model.' },
  'scenario.bet.tip.regret': { cs: 'Průměrná ztráta výplaty proti nejlepší bráně: (výplata nejlepší − výplata zvolené) ÷ výplata nejlepší, přes všechny odpovědi i pozdní; neplatná odpověď ztrácí celou výplatu. 0 % = model volí vždy nejlepší bránu. Stejné číslo je pod tabulkou „Přesnost podle úrovně“.', en: 'The mean loss of payout against the best gate: (payout of the best − payout of the chosen) ÷ payout of the best, over all answers including the late ones; an invalid answer loses the whole payout. 0% = the model always picks the best gate. The same number is below the "Accuracy by level" table.' },
  'bet.level.same': { cs: 'stejná šance', en: 'same chance' },
  'bet.level.round': { cs: '50 nebo 100 %', en: '50 or 100%' },
  'bet.level.general': { cs: 'obecná', en: 'general' },
  'bet.line': { cs: 'regret {regret}; chyby: nejvyšší odměna {reward}, nejvyšší šance {chance}, jiné {other}, neplatné {invalid}', en: 'regret {regret}; errors: highest reward {reward}, highest chance {chance}, other {other}, invalid {invalid}' },
  'bet.label.ok': { cs: '✓ brána {n}: nejvyšší výplata {ev}', en: '✓ gate {n}: the highest payout {ev}' },
  'bet.label.reward': { cs: '✗ návnada nejvyšší odměna: brána {pick} ({pickEv}), nejvyšší výplata brána {n} ({ev})', en: '✗ highest-reward decoy: gate {pick} ({pickEv}), the highest payout is gate {n} ({ev})' },
  'bet.label.chance': { cs: '✗ návnada nejvyšší šance: brána {pick} ({pickEv}), nejvyšší výplata brána {n} ({ev})', en: '✗ highest-chance decoy: gate {pick} ({pickEv}), the highest payout is gate {n} ({ev})' },

  'legend.bet.gate': { cs: 'Brána: nahoře odměna (mince), dole šance, že ji vyplatí (výseč a procenta).', en: 'A gate: the reward at the top (coin), the chance that it pays out at the bottom (pie and percent).' },
  'legend.bet.rule': { cs: 'Výplata = odměna × šance. Správná je brána s nejvyšší výplatou, ne nutně s nejvyšší odměnou nebo šancí.', en: 'Payout = reward × chance. The right gate has the highest payout, not necessarily the highest reward or chance.' },
  'legend.bet.out': { cs: 'Po průjezdu: pod branou výplata, nejvyšší zeleně; modrý obrys = volba modelu.', en: "After the car passes: the payout under every gate, the highest in green; a blue outline = the model's pick." },
  // scénář tempomat: popis, tabulka přesnosti podle podmínek s řádky pod ní (cruise.class.*, cruise.line a cruise.errors znak po znaku jako bench.cruise.* v i18n.py), dlaždice
  'scenario.cruise.about': { cs: 'Tempomat: každá řada má nad silnicí ceduli se vzdáleností překážky v metrech, povrchem vozovky a mlhou. Model volí stupeň rychlosti tempomatu 1–7 podle tabulky v zadání: vzdálenost dá výchozí stupeň, mokro ubere 1 stupeň a náledí 2, slabá mlha 1 a hustá mlha 2. Pruh je stupeň: pruh 1 vlevo je nejpomalejší, pruh 7 vpravo nejrychlejší, a auto jede do pruhu zvoleného stupně. Modrý obrys ukáže volbu modelu; po průjezdu se správný stupeň zbarví zeleně a štítek pod řadou ukáže výpočet. Tabulka „Přesnost podle podmínek“ dělí úlohy podle toho, které podmínky platí (jen tabulka, povrch, mlha, obojí); pod ní je přesnost u hranice pásma a uvnitř něj, odchylka ve stupních a druhy chyb jako v bench.py --cruise.', en: 'Cruise control: above the road every row has a board with the distance to the obstacle in meters, the road surface and the fog. The model picks a cruise control speed level 1–7 by the table in the prompt: the distance gives the starting level, a wet road takes 1 level off and an icy road 2, light fog 1 and dense fog 2. A lane is a level: lane 1 on the left is the slowest, lane 7 on the right the fastest, and the car drives into the lane of the level it picked. A blue outline shows the pick of the model; after the car passes, the right level turns green and the label under the row shows the working. The "Accuracy by conditions" table splits the tasks by the conditions that apply (table only, road, fog, both); below it are the accuracy near a band boundary and inside a band, the deviation in levels and the error kinds as in bench.py --cruise.' },
  'scenario.cruise.extraTitle': { cs: 'Přesnost podle podmínek', en: 'Accuracy by conditions' },
  'scenario.cruise.extraTip': { cs: 'Přesnost modelu podle podmínek jako v bench.py --cruise: jen tabulka = sucho a bez mlhy, stačí přečíst tabulku; povrch = jen mokro nebo náledí; mlha = jen slabá nebo hustá mlha; obojí = povrch i mlha. Pod tabulkou: přesnost u hranice pásma (nejvýš 3 m od ní) a uvnitř pásma, podíl odpovědí nejvýš o 1 stupeň vedle, MAE (průměrná odchylka ve stupních, neplatná odpověď = 6), počet odpovědí příliš rychle a příliš pomalu, a druhy chyb: jen vzdálenost (srážky vynechané), vynechaná podmínka, každá podmínka za 1 stupeň, sousední pásmo, jiné, neplatné. Počítají se všechny odpovědi, i pozdní.', en: 'Model accuracy by conditions as in bench.py --cruise: table only = a dry road without fog, reading the table is enough; road = only a wet or icy road; fog = only light or dense fog; both = road and fog. Below the table: the accuracy near a band boundary (at most 3 m from it) and inside a band, the share of answers at most 1 level off, MAE (the mean deviation in levels, an invalid answer = 6), the number of answers that are too fast and too slow, and the error kinds: distance only (reductions left out), a condition left out, each condition as 1 level, the neighboring band, other, invalid. All answers count, including the late ones.' },
  'scenario.cruise.col.class': { cs: 'podmínky', en: 'conditions' },
  'scenario.cruise.col.ratio': { cs: 'správně / celkem', en: 'correct / total' },
  'scenario.cruise.tile.match': { cs: 'správný stupeň', en: 'correct level' },
  'scenario.cruise.tile.mae': { cs: 'MAE (stupně)', en: 'MAE (levels)' },
  'scenario.cruise.tile.rate': { cs: 'řad za sekundu: požadováno / rozhodnuto', en: 'rows per second: required / decided' },
  'scenario.cruise.tip.match': { cs: 'Kolika řadami auto projelo ve správném stupni, ze všech projetých řad. Řada, u které odpověď nepřišla včas, se počítá jako nezvládnutá. Čistou kvalitu modelu ukazuje dlaždice „přesnost modelu“.', en: 'The number of rows the car passed at the right level, out of all rows passed. A row where the answer did not arrive in time counts as failed. The "model accuracy" tile shows the pure quality of the model.' },
  'scenario.cruise.tip.mae': { cs: 'MAE: průměrná odchylka zvoleného stupně od správného ve stupních, ze všech odpovědí včetně pozdních; neplatná odpověď počítá jako největší možná odchylka 6. Stejné číslo je pod tabulkou „Přesnost podle podmínek“.', en: 'MAE: the mean deviation of the picked level from the right one, in levels, over all answers including the late ones; an invalid answer counts as the largest possible deviation, 6. The same number is below the "Accuracy by conditions" table.' },

  'legend.cruise.lanes': { cs: 'Pruh = stupeň rychlosti tempomatu: 1 vlevo nejpomaleji, 7 vpravo nejrychleji; modrý obrys = volba modelu.', en: 'A lane is a cruise control speed level: 1 on the left is the slowest, 7 on the right the fastest; a blue outline = the pick of the model.' },

  // scénář jízdní řád: popis, tabulka přesnosti podle velikosti tabulky s řádky pod ní (timetable.size, timetable.line a timetable.errors znak po znaku jako bench.timetable.* v i18n.py), dlaždice, jména dep a služeb
  'scenario.timetable.about': { cs: 'Jízdní řád: každá řada je zásilka a 6 bran, jedna na každé depo (Olše, Bříza, Cedr, Javor, Dub, Borovice). Nad branami stojí cedule: zásilka s PSČ a službou, výjimka a tabulka tras, kde každý řádek posílá rozsah PSČ (oba kraje včetně) do jednoho depa. Výjimka pro službu zásilky má přednost před tabulkou, výjimka pro jinou službu neplatí. Model dostane zásilku, trasy a výjimky jako stav a volí depo; auto jede k jeho bráně a modrý obrys ukazuje jeho volbu. Po průjezdu je správná brána zeleně orámovaná a na ceduli zelený rámeček u toho, co rozhodlo (řádek trasy nebo výjimka); neplatná výjimka je přeškrtnutá. Pod řadou je štítek s výsledkem a důvodem. Tabulka „Přesnost podle velikosti tabulky“ dělí výsledek podle počtu řádků (3–5, 6–8, 9–12), pod ní je přesnost podle polohy PSČ a výjimky a řádek chyb jako v bench.py --timetable. Řady přijíždějí po 6 polích.', en: 'Timetable: every row is a parcel and 6 gates, one for every depot (Alder, Birch, Cedar, Maple, Oak, Pine). A board stands above the gates: the parcel with its ZIP code and service, the exception and a table of routes, where every row sends a range of ZIP codes (both ends included) to one depot. An exception for the service of the parcel wins over the table; an exception for another service does not apply. The model gets the parcel, the routes and the exceptions as the state and picks a depot; the car drives to its gate and a blue outline shows the pick. After the car passes, the right gate gets a green frame and the board a green frame at what decided (the route row or the exception); an exception that does not apply is struck through. Under the row a label gives the result and the reason. The "Accuracy by table size" table splits the result by the number of rows (3–5, 6–8, 9–12); below it are the accuracy by the position of the ZIP code and by the exception, and the error line as in bench.py --timetable. Rows arrive every 6 cells.' },
  'scenario.timetable.extraTitle': { cs: 'Přesnost podle velikosti tabulky', en: 'Accuracy by table size' },
  'scenario.timetable.extraTip': { cs: 'Přesnost modelu podle velikosti tabulky jako v bench.py --timetable: 3–5, 6–8 a 9–12 řádků. Pod tabulkou přesnost podle polohy PSČ (uvnitř řádku, 1–9 od hranice, přesně na hranici; jen úlohy bez platné výjimky) a podle výjimky (žádná, platí, neplatí) a řádek chyb: sousední řádek, výjimka přehlédnutá, výjimka navíc, jiné, neplatné. U hranice je správně vždy jeden ze dvou sousedních řádků, náhoda je tam 1/2, ne 1/6. Počítají se všechny odpovědi, i pozdní.', en: 'Model accuracy by table size as in bench.py --timetable: 3–5, 6–8 and 9–12 rows. Below the table are the accuracy by the position of the ZIP code (inside a row, 1–9 from a boundary, exactly on a boundary; only tasks without an exception that applies) and by the exception (none, applies, does not apply), and the error line: neighboring row, exception missed, exception wrongly applied, other, invalid. Near a boundary the answer is always one of two neighboring rows, so chance there is 1/2, not 1/6. All answers count, including the late ones.' },
  'scenario.timetable.col.size': { cs: 'velikost tabulky', en: 'table size' },
  'scenario.timetable.col.ratio': { cs: 'správně / celkem', en: 'correct / total' },
  'scenario.timetable.tile.match': { cs: 'správné depo', en: 'right depot' },
  'scenario.timetable.tile.applies': { cs: 'výjimka platí', en: 'exception applies' },

  'scenario.timetable.tip.match': { cs: 'Kolika řadami auto projelo branou správného depa, ze všech projetých řad. Řada, u které odpověď nepřišla včas, se počítá jako nezvládnutá. Čistou kvalitu modelu ukazuje dlaždice „přesnost modelu“.', en: 'The number of rows the car passed through the gate of the right depot, out of all rows passed. A row where the answer did not arrive in time counts as failed. The "model accuracy" tile shows the pure quality of the model.' },
  'scenario.timetable.tip.applies': { cs: 'Přesnost na úlohách, kde výjimka platí (služba zásilky má výjimku): správně / celkem, i pozdní odpovědi. Model, který výjimky nečte, tu má 0. Stejné číslo je pod tabulkou „Přesnost podle velikosti tabulky“.', en: 'Accuracy on the tasks where the exception applies (the service of the parcel has an exception): correct / total, late answers included. A model that does not read the exceptions gets 0 here. The same number is below the "Accuracy by table size" table.' },

  'legend.timetable.exception': { cs: 'Výjimka pro službu zásilky má přednost před tabulkou; výjimka pro jinou službu neplatí.', en: "An exception for the parcel's service wins over the table; an exception for another service does not apply." },
  'legend.timetable.gates': { cs: 'Brány jsou depa; tečka u trasy má barvu depa. Modrý obrys = volba modelu.', en: 'The gates are the depots; the dot at a route has the color of its depot. Blue outline = the pick of the model.' },
  'legend.timetable.out': { cs: 'Po průjezdu: zelený rámeček u správné brány a u toho, co rozhodlo (řádek trasy nebo výjimka); neplatná výjimka přeškrtnutá.', en: 'After the car passes: a green frame at the right gate and at what decided (the route row or the exception); an exception that does not apply is struck through.' },
  // scénář tah na výhru: popis, tabulka, dlaždice, třídy a řádky jako bench.py --tictactoe, štítky výsledku, cedulka nad deskou, legenda
  'scenario.tictactoe.about': { cs: 'Tah na výhru (piškvorky 3×3): každá řada je deska 3×3 namalovaná na silnici jako blok 3 řádků; sloupec desky = pruh, silnice má proto vždy 3 pruhy. Auto hraje za značku na odznaku na střeše (X modře, O oranžově) a cedulka nad deskou ukazuje tutéž značku (hraješ X). Model dostane značku a všech 9 polí jménem (r1c1 je řádek 1 nahoře a sloupec 1 vlevo) a volí pole podle pravidel s pořadím: vyhraj, jinak zablokuj linku soupeře, jinak udělej vidličku (tah, po kterém máš dvě různé cesty k výhře). Správné pole je v každé úloze jediné. Auto najede do pruhu sloupce a v řádku pole nechá svou značku; dokud tím řádkem neprojede, je značka poloprůhledná. Volba obsazeného pole = červený kroužek nárazu do značky. Po vyhodnocení má správné pole zelený rámeček; u výhry vede zelená čára přes trojici, u bloku oranžová čára přes linku soupeře, u vidličky ukážou dvě čárkované zelené čáry obě hrozby; po chybě má zvolené pole červený rámeček. Štítek pod autem jmenuje třídu úlohy, nebo druh chyby jako řádek chyb pod tabulkou, neplatnou odpověď a nestihl. Desky přijíždějí po 6 polích. Tabulka „Přesnost podle třídy“ dělí výsledek podle třídy úlohy jako bench.py --tictactoe.', en: 'Winning move (3×3 tic-tac-toe): every row is a 3×3 board painted on the road as a block of 3 rows; a column of the board = a lane, so the road always has 3 lanes. The car plays the mark on the badge on its roof (X in blue, O in orange), and a sign above the board shows the same mark (you play X). The model gets the mark and all 9 cells by name (r1c1 is row 1 at the top and column 1 on the left) and picks a cell by rules in order: win, otherwise block the line of the opponent, otherwise make a fork (a move after which you have two different ways to win). Every task has exactly one right cell. The car drives into the lane of the column and leaves its mark in the row of the cell; until the car passes that row, the mark is see-through. Picking an occupied cell = a red ring of a crash into the mark. After the verdict the right cell has a green frame; for a win a green line runs through the three, for a block an orange line through the line of the opponent, for a fork two dashed green lines show both threats; after an error the picked cell has a red frame. A label under the car names the class of the task, or the kind of error as in the error line under the table, an invalid answer or missed. The boards arrive every 6 cells. The "Accuracy by class" table splits the result by the class of the task as in bench.py --tictactoe.' },
  'scenario.tictactoe.extraTitle': { cs: 'Přesnost podle třídy', en: 'Accuracy by class' },
  'scenario.tictactoe.extraTip': { cs: 'Přesnost modelu podle třídy úlohy jako v bench.py --tictactoe: výhra = model má jedinou vítěznou linku, soupeř žádnou; blok = soupeř má jedinou vítěznou linku a každý jiný tah prohrává hned; výhra před blokem = vyhrát jde i zablokovat a správně je vyhrát; vidlička = nikdo nemá vítězný tah a jediné pole dá modelu dvě hrozby naráz. Pod tabulkou jako v bench.py: přesnost podle značky na tahu (X, O) a počtu volných polí (2–3, 4–6) a počty chyb. Generátor hlídá, aby levné zkratky (střed, roh, sousedé značek) trefily správné pole jen o málo častěji než náhoda; pole na nejvíc linkách bez značky soupeře trefí vidličku asi ve třech čtvrtinách úloh, i to je uvažování o linkách, jen neúplné. Počítají se všechny odpovědi, i pozdní.', en: 'Model accuracy by the class of the task as in bench.py --tictactoe: win = the model has one winning line and the opponent none; block = the opponent has one winning line and every other move loses at once; win before block = the model can win or block, and winning is right; fork = nobody has a winning move and one cell gives the model two threats at once. Below the table, as in bench.py: the accuracy by the mark to move (X, O) and by the number of free cells (2–3, 4–6), and the error counts. The generator keeps cheap shortcuts (the center, a corner, the neighbors of the marks) right only a little more often than chance; the cell on the most lines without a mark of the opponent finds the fork in about three quarters of the tasks, which is reasoning about lines too, only partial. All answers count, including the late ones.' },
  'scenario.tictactoe.col.class': { cs: 'třída úlohy', en: 'class of the task' },
  'scenario.tictactoe.col.ratio': { cs: 'správně / celkem', en: 'correct / total' },
  'scenario.tictactoe.tile.match': { cs: 'správný tah', en: 'correct move' },
  'scenario.tictactoe.tip.match': { cs: 'Kolika deskami auto projelo se správným tahem, ze všech projetých desek. Deska, u které odpověď nepřišla včas, se počítá jako nezvládnutá. Čistou kvalitu modelu ukazuje dlaždice „přesnost modelu“.', en: 'The number of boards the car passed with the right move, out of all boards passed. A board where the answer did not arrive in time counts as failed. The "model accuracy" tile shows the pure quality of the model.' },
  'scenario.tictactoe.tile.blockNotWin': { cs: 'blok místo výhry', en: 'block instead of win' },
  'scenario.tictactoe.tip.blockNotWin': { cs: 'Kolikrát model ve třídě výhra před blokem zablokoval soupeře, místo aby vyhrál, z úloh této třídy (i pozdní odpovědi). Ukazuje, jestli model drží pořadí pravidel. Stejné číslo je v řádku chyb pod tabulkou „Přesnost podle třídy“.', en: 'How many times the model blocked the opponent instead of winning in the win before block class, out of the tasks of that class (late answers included). It shows whether the model keeps the order of the rules. The same number is in the error line below the "Accuracy by class" table.' },
  'scenario.tictactoe.tile.rate': { cs: 'desek za sekundu: požadováno / rozhodnuto', en: 'boards per second: required / decided' },
